<script>
(function(){
  function apply(l){
    var k = l === 'en' ? 'data-en' : 'data-zh';
    document.querySelectorAll('[' + k + ']').forEach(function(e){
      var v = e.getAttribute(k); if (v) e.textContent = v;
    });
    document.documentElement.setAttribute('lang', l === 'en' ? 'en' : 'zh-CN');
  }
  function cur(){
    try { var s = localStorage.getItem('arcade_lang'); if (s === 'zh' || s === 'en') return s; } catch (e) {}
    return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  }
  apply(cur());
  window.addEventListener('ncn:lang', function(e){ apply(e.detail && e.detail.lang || cur()); });
})();
</script>
