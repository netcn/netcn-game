  <style>
    .su-wrap { padding: 14px 10px 22px; width: min(420px, 96vw); box-sizing: border-box; text-align: center; }
    .su-top { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; margin-bottom: 10px; font-size: 13px; color: var(--text-dim); }
    .su-top .btn { margin-left: auto; }
    .su-tier { color: var(--neon-purple); font-size: 11px; letter-spacing: .04em; }
    .su-hintct { color: var(--neon-yellow); font-size: 12px; display: inline-flex; align-items: center; }
    .su-ic-dot { width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--neon-yellow); box-shadow: 0 0 6px var(--neon-yellow); display: inline-block; }
    /* 棋盘视口：默认 1× 不横向溢出；放大后仅在视口内部平移，页面本身不横向滚动 */
    .su-boardwrap { width: min(360px, 100%); margin: 0 auto 8px; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; border-radius: 8px; touch-action: pan-x pan-y; }
    .su-board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); width: calc(100% * var(--su-zoom, 1)); box-sizing: border-box; margin: 0; }
    .su-zoomers { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 0 0 8px; }
    .su-zoomers button { min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: var(--text); font-family: var(--font-mono); font-size: 13px; cursor: pointer; transition: background .15s, box-shadow .15s; }
    .su-zoomers button:active { transform: translateY(1px); }
    .su-zoomers button.selected { background: rgba(0,240,255,0.18); box-shadow: inset 0 0 0 1px var(--accent), 0 0 12px rgba(0,240,255,.35); color: var(--accent); }
    .su-zoomers .su-zlbl { font-size: 10px; color: var(--text-dim); min-width: 68px; letter-spacing: .04em; font-family: var(--font-mono); }
    .su-zoomtip { font-size: 10px; color: var(--text-dim); margin: -6px 0 6px; letter-spacing: .04em; }
    .su-cell { aspect-ratio: 1 / 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: var(--font-pixel); font-size: 19px; background: #11131a; color: var(--neon-cyan); cursor: pointer; user-select: none; }
    .su-cell.fixed { color: var(--text); }
    .su-cell.sel { background: rgba(0,240,255,0.22); box-shadow: inset 0 0 0 2px var(--accent); }
    .su-cell.peer { background: rgba(255,255,255,0.05); }
    .su-cell.wrong { color: var(--neon-pink); background: rgba(255,45,149,0.16); box-shadow: inset 0 0 0 2px rgba(255,45,149,.7); }
    .su-cell.wrongfx { animation: suWrong .35s cubic-bezier(.2,1.4,.4,1); }
    @keyframes suWrong { 0% { transform: scale(1); } 35% { transform: scale(1.18) rotate(-4deg); } 70% { transform: scale(.94) rotate(3deg); } 100% { transform: none; } }
    .su-board.won .su-cell { animation: suWinCell .5s ease-out both; }
    @keyframes suWinCell {
      0% { background: rgba(57,255,20,0); }
      40% { background: rgba(57,255,20,.55); color: #fff; transform: scale(1.06); }
      100% { background: #11131a; transform: none; }
    }
    .su-cell .su-notes { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; padding: 2px; box-sizing: border-box; }
    .su-cell .su-notes span { display: flex; align-items: center; justify-content: center; font-family: var(--font-body); font-size: 8.5px; color: var(--text-dim); line-height: 1; }
    .su-cell.x-mode { background-image: linear-gradient(135deg, rgba(185,103,255,.10), transparent 42%, transparent 58%, rgba(185,103,255,.10)); }
    .su-cell.hintfx { background: rgba(255,230,0,.24) !important; box-shadow: inset 0 0 0 2px var(--neon-yellow), 0 0 14px rgba(255,230,0,.6); animation: suHint .8s cubic-bezier(.2,1.4,.4,1); }
    @keyframes suHint { 0% { transform: scale(1); } 30% { transform: scale(1.14); } 100% { transform: scale(1); } }
    .su-cell:nth-child(3n) { margin-right: 1px; }
    .su-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: fit-content; margin: 0 auto; }
    .su-key { position: relative; min-height: 44px; padding: 10px 0; font-family: var(--font-pixel); font-size: 17px; border-radius: 7px; cursor: pointer; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16); color: var(--text); transition: background .15s ease, transform .1s ease, box-shadow .15s ease; }
    .su-key:active { transform: translateY(1px); }
    .su-key.done { opacity: .42; }
    .su-key.erase { color: var(--neon-pink); }
    .su-key .su-left { position: absolute; top: 2px; right: 5px; font-size: 8px; color: var(--text-dim); font-family: var(--font-mono); }
    .su-diffs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 8px 0 0; }
    .su-diffs .mode-btn, .su-tools .mode-btn { min-height: 44px; }
    .su-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 8px 0 2px; }
    .su-tools .mode-btn { font-size: 11px; }
    .su-msg { min-height: 18px; font-size: 13px; color: var(--neon-pink); margin: 10px 0 4px; }
    .su-ov-meta { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; margin: -8px 0 12px; }
    .su-keys-hint { font-size: 10px; color: var(--text-dim); margin: 2px 0 6px; letter-spacing: .04em; text-align: center; }
    .su-overlay {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: rgba(4, 6, 12, .78); backdrop-filter: blur(4px);
    }
    .su-overlay.hidden { display: none; }
    .su-ov-card {
      width: min(340px, 88vw); padding: 26px 22px; text-align: center;
      background: linear-gradient(160deg, rgba(16,20,36,.98), rgba(8,10,20,.98));
      border: 1px solid rgba(57,255,20,.45); border-radius: 18px;
      box-shadow: 0 0 40px rgba(57,255,20,.25), inset 0 0 30px rgba(0,240,255,.06);
      animation: suCard .5s cubic-bezier(.2,1.4,.4,1) both;
    }
    @keyframes suCard { from { opacity: 0; transform: translateY(18px) scale(.9); } to { opacity: 1; transform: none; } }
    .su-ov-title { font-family: var(--font-pixel); font-size: 18px; color: var(--neon-green); text-shadow: 0 0 12px rgba(57,255,20,.7); margin-bottom: 14px; }
    .su-ov-row { display: flex; justify-content: center; gap: 22px; margin: 10px 0; font-size: 12px; color: var(--text-dim); }
    .su-ov-row b { display: block; font-family: var(--font-pixel); font-size: 16px; color: var(--neon-cyan); margin-top: 4px; }
    .su-ov-row .err b { color: var(--neon-pink); }
    .su-ov-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  </style>
</head>
