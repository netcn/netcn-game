  <style>
    .sh-wrap, .sh-wrap * { box-sizing: border-box; }
    .sh-wrap { padding: 12px 10px 24px; width: 100%; max-width: 520px; margin: 0 auto; text-align: center; }
    .sh-picker {
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      border: 1px solid rgba(57, 255, 20, 0.32); border-radius: 16px;
      padding: 18px 16px 16px; margin: 6px 0 10px;
      box-shadow: 0 0 28px rgba(57, 255, 20, 0.10), inset 0 0 18px rgba(57, 255, 20, 0.05);
    }
    .sh-picker-t {
      font-family: var(--font-pixel); font-size: 14px; letter-spacing: 1px;
      color: var(--neon-green); text-shadow: 0 0 12px rgba(57, 255, 20, 0.45); margin-bottom: 8px;
    }
    .sh-picker-d { font-size: 12px; color: var(--text-dim); line-height: 1.75; margin: 0 auto 14px; max-width: 330px; }
    .sh-diffs { display: grid; gap: 8px; margin: 0 0 12px; }
    .sh-diff {
      display: flex; flex-direction: column; gap: 3px; width: 100%;
      padding: 10px 13px; text-align: left; cursor: pointer; font-family: inherit;
      background: linear-gradient(90deg, rgba(57, 255, 20, 0.06), rgba(185, 103, 255, 0.05));
      border: 1px solid rgba(57, 255, 20, 0.28); border-radius: 10px;
      color: var(--text-main, #e8e8f0); transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .sh-diff b { font-family: var(--font-pixel); font-size: 11px; letter-spacing: .5px; color: var(--neon-yellow); }
    .sh-diff small { font-size: 11px; color: var(--text-dim); }
    .sh-diff:hover { transform: translateY(-1px); border-color: var(--neon-green); box-shadow: 0 0 16px rgba(57, 255, 20, 0.28); }
    .sh-diff:active { transform: translateY(0); }
    .sh-daily { margin-top: 2px; font-size: 11px; padding: 5px 14px; }

    .sh-hud {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px;
      font-size: 11px; color: var(--text-dim); padding: 8px 10px;
      background: linear-gradient(90deg, rgba(57, 255, 20, 0.08), rgba(185, 103, 255, 0.06));
      border: 1px solid rgba(57, 255, 20, 0.3); border-radius: 9px;
    }
    .sh-hud #sh-score, .sh-hud #sh-time { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 10px; }
    .sh-hud.sh-low-time, .sh-hud #sh-time.sh-low { color: var(--neon-pink); animation: sh-pulse 0.9s ease-in-out infinite; }
    @keyframes sh-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

    .sh-stage { position: relative; width: 100%; max-width: 380px; margin: 10px auto 6px; }
    .sh-cv {
      display: block; width: 100%; height: auto; max-width: 100%;
      border-radius: 16px; touch-action: none; user-select: none; -webkit-user-select: none;
      background: #08130d; box-shadow: 0 0 20px rgba(57, 255, 20, 0.16), 0 10px 26px rgba(0, 0, 0, 0.55);
    }
    .sh-hint { font-size: 11px; color: var(--text-dim); line-height: 1.6; margin: 6px 2px 0; }
    .sh-msg {
      font-size: 12px; color: var(--text-main); min-height: 20px; margin: 5px 0 0;
      padding: 7px 9px; text-align: left; border-radius: 8px;
      background: rgba(0, 0, 0, 0.32); border: 1px solid rgba(24,32,52,0.08);
    }

    .sh-overlay { background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2)); padding: 16px; }
    .sh-card {
      width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px;
      padding: 18px 16px; border-radius: 16px;
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      border: 1px solid rgba(57, 255, 20, 0.45); box-shadow: 0 0 32px rgba(57, 255, 20, 0.22);
    }
    .sh-card h2 { font-family: var(--font-pixel); font-size: 14px; letter-spacing: 1px; color: var(--neon-yellow); margin: 0; }
    .sh-card p { font-size: 12px; line-height: 1.8; color: var(--text-dim); margin: 0; }
    .sh-card p b { color: var(--neon-yellow); }
    .sh-stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); }
    .sh-stats b { display: inline-block; margin-left: 3px; font-family: var(--font-pixel); font-size: 12px; color: var(--neon-yellow); }
    .sh-newrec { font-family: var(--font-pixel); font-size: 10px; letter-spacing: .5px; color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255, 230, 0, 0.7); }
    .sh-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .sh-btns .btn { min-width: 108px; }

    @media (max-width: 480px) {
      .sh-wrap { padding: 10px 8px 20px; }

      .sh-hud { font-size: 10px; gap: 5px 8px; padding: 7px 8px; }
      .sh-hud #sh-score, .sh-hud #sh-time { font-size: 9px; }
      .sh-card { padding: 15px 12px; }
      .sh-btns .btn { min-width: 96px; font-size: 11px; }
    }
  </style>
