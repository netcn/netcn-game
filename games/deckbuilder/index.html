  <style>
    /* ============ 卡牌构筑 · 旗舰战斗界面 ============ */
    .dk-wrap {
      --dk-card-w: 86px; --dk-card-h: 126px;
      position: relative; width: min(600px, 100%); margin: 0 auto;
      padding: 6px 10px 18px; text-align: center;
    }
    .dk-screen.hidden { display: none !important; }

    /* ---------- 难度选择 ---------- */
    .dk-pick { padding: 12px 2px 6px; }
    .dk-pick-t {
      font-family: var(--font-pixel); font-size: 14px; line-height: 1.8; letter-spacing: 1px;
      color: var(--neon-cyan); text-shadow: 0 0 14px rgba(0,240,255,0.55);
    }
    .dk-pick-d { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 8px auto 14px; }
    .dk-class-title {
      font-size: 11px; font-weight: 600; color: var(--neon-purple); text-align: left;
      margin: 0 0 6px; letter-spacing: 1px;
    }
    .dk-class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .dk-class {
      position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
      min-height: 74px; padding: 9px 42px 9px 10px; cursor: pointer; color: var(--text-main);
      background: linear-gradient(160deg, rgba(185,103,255,0.08), rgba(10,14,28,0.9));
      border: 1px solid rgba(185,103,255,0.28); border-radius: 11px;
      font-family: var(--font-body); transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .dk-class::before {
      content: attr(data-emblem); position: absolute; top: 9px; right: 10px;
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      font-family: var(--font-pixel); font-size: 11px; color: var(--neon-purple);
      background: rgba(185,103,255,0.12); border: 1px solid rgba(185,103,255,0.35);
    }
    .dk-class:hover { transform: translateY(-2px); border-color: var(--neon-purple); box-shadow: 0 0 16px rgba(185,103,255,.28); }
    .dk-class:active { transform: scale(.97); }
    .dk-class.sel { border-color: var(--neon-yellow); box-shadow: 0 0 16px rgba(255,230,0,.3); }
    .dk-class-n { font-family: var(--font-pixel); font-size: 10px; color: var(--neon-cyan); line-height: 1.6; }
    .dk-class.sel .dk-class-n { color: var(--neon-yellow); }
    .dk-class-d { font-size: 9px; line-height: 1.45; color: var(--text-dim); }
    .dk-diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .dk-diff {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
      min-height: 118px; padding: 10px 11px; cursor: pointer; color: var(--text-main);
      background: linear-gradient(160deg, rgba(0,240,255,0.09), rgba(185,103,255,0.06));
      border: 1px solid rgba(0,240,255,0.26); border-radius: 12px;
      font-family: var(--font-body); transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .dk-diff:hover { transform: translateY(-3px); border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,240,255,0.28); }
    .dk-diff:active { transform: scale(0.97); }
    .dk-diff-n { font-family: var(--font-pixel); font-size: 10px; line-height: 1.7; color: var(--neon-cyan); }
    .dk-diff:nth-child(2) .dk-diff-n { color: var(--neon-yellow); }
    .dk-diff:nth-child(3) .dk-diff-n { color: var(--neon-pink); }
    .dk-diff-d { font-size: 10px; line-height: 1.6; color: var(--text-dim); }
    .dk-diff-best { font-family: var(--font-pixel); font-size: 9px; color: var(--neon-yellow); margin-top: 12px; line-height: 1.8; }
    .dk-start-btn { width: 100%; margin-top: 12px; min-height: 48px; }
    .dk-pick-help { font-size: 11px; line-height: 1.8; color: var(--text-dim); margin-top: 10px; text-align: left; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 9px 11px; }

    /* ---------- HUD ---------- */
    .dk-hud { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin: 2px 0 6px; }
    .dk-chip {
      display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 3px 8px;
      background: rgba(0,0,0,0.34); border: 1px solid rgba(0,240,255,0.2); border-radius: 8px;
      color: var(--text-dim); font-size: 10px; line-height: 1.2;
    }
    .dk-chip b { font-family: var(--font-mono); font-size: 12px; color: var(--neon-cyan); }
    .dk-chip.hp b { color: var(--neon-pink); }
    .dk-chip.block b { color: var(--neon-cyan); }
    .dk-chip.gold b { color: var(--neon-yellow); }
    .dk-chip.floor { flex: 0 0 auto; }
    .dk-chip.act {
      font-family: var(--font-pixel); font-size: 9px; color: var(--neon-purple);
      border-color: rgba(185,103,255,.45); background: rgba(185,103,255,.08);
    }
    .dk-hud-spacer { flex: 1 1 auto; }
    .dk-energy-orb {
      position: relative; width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 30%, #fff8b0, #ffe600 38%, #ff9f1c 72%, #7a3c00);
      border: 2px solid rgba(255,255,255,0.55);
      box-shadow: 0 0 16px rgba(255,230,0,0.6), inset 0 0 10px rgba(120,60,0,0.5);
      color: #221800; font-family: var(--font-mono); line-height: 1;
      transition: transform .15s;
    }
    .dk-energy-orb b { font-size: 19px; }
    .dk-energy-orb small { font-size: 8px; opacity: 0.7; }
    .dk-energy-orb.low { filter: saturate(0.55) brightness(0.8); }
    .dk-energy-orb.pulse { animation: dk-orb 0.35s ease; }
    @keyframes dk-orb { 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }
    .dk-piles { display: flex; gap: 5px; }
    .dk-pile {
      min-width: 42px; min-height: 34px; padding: 3px 5px; cursor: pointer; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.16); border-radius: 7px;
      color: var(--text-dim); font-size: 8px; line-height: 1.2;
    }
    .dk-pile b { font-family: var(--font-mono); font-size: 12px; color: #fff; }
    .dk-pile:active { transform: scale(.95); }

    /* ---------- 战斗舞台 ---------- */
    .dk-stage {
      position: relative; margin: 0 auto 4px; width: 100%; max-width: 360px;
      border-radius: 12px; overflow: hidden;
      background: radial-gradient(circle at 50% 30%, rgba(185,103,255,0.16), rgba(6,8,16,0.9) 70%);
      border: 1px solid rgba(185,103,255,0.3);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 18px rgba(185,103,255,0.12);
    }
    .dk-stage canvas { display: block; width: 100%; height: auto; touch-action: manipulation; cursor: crosshair; }
    .dk-enemy-hud {
      position: absolute; left: 0; right: 0; top: 0; padding: 6px 9px 4px; pointer-events: none;
      background: linear-gradient(180deg, rgba(4,6,14,0.85), rgba(4,6,14,0));
    }
    .dk-enemy-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .dk-enemy-name { font-size: 12px; font-weight: 600; color: #ffd6e8; text-shadow: 0 0 8px rgba(255,45,149,.5); }
    .dk-enemy-tag { font-family: var(--font-pixel); font-size: 8px; color: var(--neon-pink); }
    .dk-enemy-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 5px; }
    .dk-enemy-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff2d95, #ff9f1c); transition: width .25s; box-shadow: 0 0 8px rgba(255,45,149,.7); }
    .dk-enemy-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; font-size: 9px; color: var(--text-dim); }
    .dk-enemy-block { color: var(--neon-cyan); }
    .dk-intent-badge {
      display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--neon-yellow);
      text-shadow: 0 0 8px rgba(255,230,0,.5);
    }
    .dk-intent-badge .ic { font-size: 12px; }
    .dk-player-panel {
      display: flex; align-items: center; gap: 6px; margin: 5px 0 2px; padding: 5px 7px;
      background: rgba(0,240,255,0.05); border: 1px solid rgba(0,240,255,0.18); border-radius: 9px;
      cursor: pointer;
    }
    .dk-player-hp { flex: 1 1 120px; text-align: left; }
    .dk-player-hp .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 3px; }
    .dk-player-hp .bar i { display: block; height: 100%; background: linear-gradient(90deg, #39ff14, #00f0ff); transition: width .25s; }
    .dk-player-hp .t { font-size: 9px; color: var(--text-dim); }
    .dk-player-hp .t b { font-family: var(--font-mono); color: #fff; font-size: 11px; }
    .dk-shield {
      display: inline-flex; align-items: center; gap: 3px; min-width: 48px; justify-content: center;
      color: var(--neon-cyan); font-family: var(--font-mono); font-size: 12px;
      background: rgba(0,240,255,0.08); border: 1px solid rgba(0,240,255,0.3); border-radius: 7px; padding: 4px 6px;
    }
    .dk-shield .sh { width: 11px; height: 13px; background: var(--neon-cyan); clip-path: polygon(50% 0,100% 22%,88% 78%,50% 100%,12% 78%,0 22%); box-shadow: 0 0 8px rgba(0,240,255,.7); }
    .dk-status { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; min-height: 14px; }
    .dk-status span {
      font-size: 8px; line-height: 1; padding: 3px 5px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.17); color: var(--text-dim); background: rgba(0,0,0,.28);
    }
    .dk-status .vuln { color: #ffb7cb; border-color: rgba(255,45,149,.4); }
    .dk-status .weak { color: #c9c9ff; border-color: rgba(185,103,255,.4); }
    .dk-status .str { color: var(--neon-yellow); border-color: rgba(255,230,0,.4); }
    .dk-status .poison { color: var(--neon-green); border-color: rgba(57,255,20,.35); }

    /* ---------- 手牌 ---------- */
    .dk-handwrap { position: relative; margin: 4px 0 2px; }
    .dk-hand {
      display: flex; gap: 7px; overflow-x: auto; overflow-y: hidden; padding: 12px 6px 8px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
      min-height: calc(var(--dk-card-h) + 26px); justify-content: flex-start;
      scrollbar-width: thin;
    }
    .dk-hand::-webkit-scrollbar { height: 4px; }
    .dk-hand::-webkit-scrollbar-thumb { background: rgba(0,240,255,.35); border-radius: 3px; }
    .dk-hand-empty { width: 100%; align-self: center; color: var(--text-dim); font-size: 11px; padding: 42px 0; }
    .dk-card {
      position: relative; flex: 0 0 auto; width: var(--dk-card-w); height: var(--dk-card-h);
      scroll-snap-align: center; border-radius: 9px; cursor: pointer; user-select: none;
      padding: 3px; background: linear-gradient(150deg, var(--b1, #5a6bff), var(--b2, #1b2550));
      box-shadow: 0 3px 8px rgba(0,0,0,.5);
      transition: transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s, filter .14s;
    }
    .dk-card::before {
      content: ''; position: absolute; inset: 2px; border-radius: 7px;
      background: linear-gradient(165deg, #1b2442, #0d1226 62%, #0a0f1f);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .dk-card-inner { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
    .dk-card.type-atk { --b1: #ff2d95; --b2: #5a1030; }
    .dk-card.type-def { --b1: #00f0ff; --b2: #083b4a; }
    .dk-card.type-sp  { --b1: #b967ff; --b2: #2d1150; }
    .dk-card.rar-rare { --b1: #ffe600; --b2: #7a3c00; }
    .dk-card.rar-rare::before { background: linear-gradient(165deg, #241f0d, #0d1226 55%, #0a0f1f); }
    .dk-card.rar-uncommon::before { background: linear-gradient(165deg, #1d2340, #0d1226 62%); }
    .dk-card:hover { transform: translateY(-9px); box-shadow: 0 8px 18px rgba(0,0,0,.6), 0 0 14px var(--b1); }
    .dk-card.sel { transform: translateY(-16px) scale(1.03); box-shadow: 0 10px 20px rgba(0,0,0,.65), 0 0 20px var(--b1); z-index: 2; }
    .dk-card.sel::after {
      content: ''; position: absolute; inset: -2px; border-radius: 10px; pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--neon-yellow), 0 0 16px rgba(255,230,0,.55);
    }
    .dk-card.cant { filter: saturate(.45) brightness(.72); cursor: not-allowed; }
    .dk-card.cant:hover { transform: none; box-shadow: 0 3px 8px rgba(0,0,0,.5); }
    .dk-card.cant .dk-desc { opacity: .82; }
    .dk-card.kb { outline: 2px dashed rgba(255,255,255,.7); outline-offset: -3px; }
    .dk-card.deny { animation: dk-deny .34s ease; }
    @keyframes dk-deny {
      0%,100% { transform: translateX(0); filter: none; }
      20% { transform: translateX(-5px); filter: drop-shadow(0 0 6px #ff2d95) saturate(1.4); }
      40% { transform: translateX(5px); filter: drop-shadow(0 0 10px #ff2d95) saturate(1.6); }
      60% { transform: translateX(-4px); filter: drop-shadow(0 0 6px #ff2d95); }
      85% { filter: drop-shadow(0 0 2px #ff2d95); }
    }
    .dk-cost {
      position: absolute; top: -5px; left: -5px; z-index: 3; width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: #231900;
      background: radial-gradient(circle at 35% 30%, #fffbd0, #ffe600 45%, #e58a00);
      border: 1.5px solid rgba(255,255,255,.6); box-shadow: 0 0 8px rgba(255,230,0,.6);
    }
    .dk-card.cant .dk-cost { background: radial-gradient(circle at 35% 30%, #a9a9a9, #5c5c5c); color: #ddd; box-shadow: none; }
    .dk-art {
      position: relative; height: 46px; margin: 5px 4px 0; border-radius: 6px; overflow: hidden;
      background: #070b18; border: 1px solid rgba(255,255,255,.09);
    }
    .dk-art canvas { display: block; width: 100%; height: 100%; }
    .dk-name { font-size: 10px; line-height: 1.25; color: #fff; font-weight: 600; margin: 4px 3px 0; text-align: center; min-height: 13px; }
    .dk-desc { font-size: 8px; line-height: 1.35; color: #a9b0c8; margin: 3px 4px; text-align: center; flex: 1 1 auto; }
    .dk-rar { position: absolute; right: 3px; bottom: 2px; z-index: 2; font-size: 7px; letter-spacing: .5px; color: rgba(255,255,255,.35); }
    .dk-card.rar-rare .dk-rar { color: var(--neon-yellow); }
    .dk-card.rar-uncommon .dk-rar { color: var(--neon-cyan); }

    /* ---------- 控制 / 消息 ---------- */
    .dk-controls { display: flex; gap: 7px; justify-content: center; align-items: stretch; margin: 6px 0 2px; }
    .dk-controls .btn { min-height: 46px; flex: 1 1 0; font-size: 11px; padding: 8px 10px; }
    .dk-controls .btn:disabled { opacity: .42; cursor: not-allowed; }
    .dk-msg {
      min-height: 18px; font-size: 11px; line-height: 1.45; color: var(--neon-green);
      margin: 4px 0; padding: 3px 8px; border-radius: 6px;
    }
    .dk-msg.warn { color: #ffb7cb; background: rgba(255,45,149,.09); animation: dk-msg-in .22s ease; }
    .dk-msg.info { color: var(--neon-yellow); }
    @keyframes dk-msg-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
    .dk-log { font-size: 10px; color: var(--text-dim); min-height: 14px; line-height: 1.5; }
    .dk-hint { font-size: 9px; color: rgba(138,138,160,.8); min-height: 13px; margin-top: 2px; }

    /* ---------- 覆盖层（奖励 / 休息 / 宝箱 / 结算 / 地图 / 牌库） ---------- */
    .dk-ov {
      position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
      background: rgba(4,6,14,0.82); border-radius: 12px; padding: 10px;
    }
    .dk-ov.hidden { display: none !important; }
    .dk-ov-card {
      width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; padding: 14px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      border-radius: 14px; border: 1px solid rgba(185,103,255,.5);
      background: linear-gradient(160deg, rgba(24,24,48,.98), rgba(8,10,20,.98));
      box-shadow: 0 0 34px rgba(185,103,255,.3);
      animation: dk-ov-in .28s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes dk-ov-in { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: none; } }
    .dk-ov-title { font-family: var(--font-pixel); font-size: 12px; line-height: 1.8; color: var(--neon-yellow); text-align: center; }
    .dk-ov-sub { font-size: 11px; line-height: 1.6; color: var(--text-dim); text-align: center; }
    .dk-ov-row { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
    .dk-ov-row .btn { flex: 1 1 130px; min-height: 46px; font-size: 11px; }
    .dk-event-card { max-width: 380px; }
    .dk-event-opts { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
    .dk-event-opt {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
      width: 100%; min-height: 50px; padding: 8px 11px; cursor: pointer; color: var(--text-main);
      background: linear-gradient(160deg, rgba(185,103,255,.12), rgba(10,14,28,.92));
      border: 1px solid rgba(185,103,255,.32); border-radius: 10px;
