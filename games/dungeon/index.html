  <style>
    .dg-wrap { padding: 12px 10px 20px; width: min(560px, 98vw); text-align: center; }
    .dg-canvas {
      width: 100%; height: auto; border-radius: 10px; background: #05050b;
      box-shadow: var(--ui-shadow); touch-action: none; max-width: 100%; }
    .dg-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin: 8px 2px; color: var(--text-dim); }
    .dg-top .hp { color: var(--neon-green); font-family: var(--font-pixel); text-shadow: 0 0 6px rgb(var(--nc-green-rgb) / .5); }
    .dg-top .lv { color: var(--neon-purple); font-family: var(--font-pixel); text-shadow: 0 0 6px rgb(var(--nc-purple-rgb) / .5); }
    .dg-top .atk { color: var(--neon-yellow); font-family: var(--font-pixel); text-shadow: 0 0 6px rgb(var(--nc-yellow-rgb) / .5); }
    .dg-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 6px 0; line-height: 1.6; }
    .dg-overlay {
      position: absolute; inset: 0; z-index: 2; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: var(--nc-stage-2); text-align: center; padding: 18px;
    }
    .dg-overlay.hidden { display: none; }
    .dg-stage { position: relative; }
    .dg-ov-title { font-family: var(--font-pixel); font-size: 18px; color: var(--neon-pink); text-shadow: 0 0 10px rgb(var(--nc-pink-rgb) / .6); }
    .dg-ov-title.win { color: var(--neon-green); text-shadow: 0 0 10px rgb(var(--nc-green-rgb) / .6); }
    .dg-ov-sub { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
    .dg-ov-sub b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 12px; }
    .dg-leg { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
    .dg-leg span { display: inline-flex; align-items: center; gap: 4px; }
    .dg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
    .dg-top .hp, .dg-top .lv, .dg-top .atk { display: inline-block; }
    .dg-hpwrap { display: inline-flex; align-items: center; gap: 5px; }
    .dg-hpbar { display: inline-block; width: 58px; height: 7px; border-radius: 4px; background: rgba(24,32,52,0.08); border: 1px solid rgb(var(--nc-green-rgb) / 0.28); overflow: hidden; }
    .dg-hpfill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #39ff14, #b6ff9c); transition: width .18s ease; }
    .dg-pausebtn { background: rgba(24,32,52,0.06); border: 1px solid rgb(var(--nc-cyan-rgb) / 0.35); color: var(--neon-cyan); border-radius: 8px; padding: 2px 8px; font-size: 13px; cursor: pointer; }
    .dg-pause { position: absolute; inset: 0; z-index: 3; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--nc-stage-2); backdrop-filter: blur(2px); }
    .dg-pause.hidden { display: none; }
    .dg-pause-t { font-family: var(--font-pixel); font-size: 16px; color: var(--neon-yellow); text-shadow: 0 0 10px rgb(var(--nc-yellow-rgb) / .55); }
    .dg-pause-d { font-size: 12px; color: var(--text-dim); }
    .dg-ov-stats { font-size: 12px; color: var(--neon-yellow); min-height: 16px; letter-spacing: .4px; }
    .dg-overlay .game-controls { flex-wrap: wrap; justify-content: center; }
    .dg-pop { animation: dgPop .22s ease; }
    @keyframes dgPop { 0%{transform:scale(1)} 40%{transform:scale(1.3);filter:brightness(1.8)} 100%{transform:scale(1)} }
    @keyframes dgOvIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dgOvCardIn { from { opacity: 0; transform: translateY(10px) scale(.95); } to { opacity: 1; transform: none; } }
    .dg-overlay:not(.hidden), .dg-pause:not(.hidden) { animation: dgOvIn .2s ease-out both; }
    .dg-overlay:not(.hidden) .dg-ov-title, .dg-overlay:not(.hidden) .dg-ov-stats,
    .dg-pause:not(.hidden) .dg-pause-t, .dg-pause:not(.hidden) .dg-pause-btns {
      animation: dgOvCardIn .26s cubic-bezier(.2,.9,.3,1.18) both;
    }
    .dg-stage.hidden, .dg-menu.hidden, .dg-equip.hidden, .dg-eqp.hidden, .dg-skillbar.hidden { display: none; }
    .dg-canvas { display: block; margin: 0 auto; }
    .dg-top .dg-lbl { font-size: 10px; letter-spacing: 1px; color: var(--text-dim); margin-right: 3px; }
    .dg-top .dg-chip { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
    .dg-pausebtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 0; }
    .dg-pausebtn i { display: block; width: 3px; height: 13px; background: var(--neon-cyan); box-shadow: var(--ui-shadow); }
    .dg-menu { margin: 4px 0 10px; padding: 10px; border: 1px solid rgb(var(--nc-cyan-rgb) / .16); border-radius: 12px; background: var(--nc-stage-2); text-align: center; }
    .dg-menu-title { font-family: var(--font-pixel); font-size: 13px; color: var(--neon-cyan); text-shadow: 0 0 10px rgb(var(--nc-cyan-rgb) / .5); line-height: 1.7; }
    .dg-menu-sub { font-size: 11px; color: var(--text-dim); line-height: 1.7; margin: 6px 0 8px; }
    .dg-classes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
    .dg-class { min-width: 0; min-height: 58px; padding: 6px 5px; border-radius: 10px; cursor: pointer; text-align: center;
      background: rgba(24,32,52,.035); border: 1px solid rgba(24,32,52,.14); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: .15s ease; }
    .dg-class:hover, .dg-class:focus-visible { border-color: var(--cls-color); box-shadow: 0 0 12px -2px var(--cls-color); }
    .dg-class.sel { border-color: var(--cls-color); box-shadow: inset 0 0 0 1px var(--cls-color), 0 0 16px -3px var(--cls-color); background: rgba(24,32,52,.07); }
    .dg-class .dg-cn { display: block; font-family: var(--font-pixel); font-size: 11px; letter-spacing: .5px; }
    .dg-class .dg-cs { display: block; font-size: 9px; color: var(--text-dim); line-height: 1.45; word-break: break-word; }
    .dg-class .dg-cd { display: none; }
    .dg-class .dg-ck { display: block; font-size: 9px; color: var(--neon-yellow); margin-top: 1px; }
    .dg-menu-hint { font-size: 10px; color: var(--text-dim); margin: 8px 0 6px; letter-spacing: .5px; }
    .dg-menu-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .dg-menu-btns .btn { flex: 1 1 120px; min-height: 44px; }
    .dg-equip { margin: 8px 0 4px; }
    .dg-slots { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
    .dg-slot { min-width: 0; padding: 5px 7px; border-radius: 8px; text-align: left;
      border: 1px solid rgba(24,32,52,.1); background: rgba(24,32,52,.03); }
    .dg-slot-l { display: block; font-size: 9px; letter-spacing: 1px; color: var(--text-dim); }
    .dg-slot-n { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .dg-eq-sum { margin-top: 5px; font-size: 10px; color: var(--text-dim); line-height: 1.6; word-break: break-word; }
    .dg-eqp { margin: 6px 0; padding: 8px; border-radius: 10px; border: 1px solid rgb(var(--nc-purple-rgb) / .5); background: rgb(var(--nc-purple-rgb) / .08); text-align: left; }
    .dg-eqp-t { font-size: 12px; color: var(--neon-yellow); margin-bottom: 5px; font-weight: 700; }
    .dg-eqp-compare { font-size: 10px; line-height: 1.55; }
    .dg-eqp-row { display: flex; gap: 6px; align-items: baseline; margin: 2px 0; }
    .dg-eqp-row > span:last-child { word-break: break-word; }
    .dg-eqp-row.new > span:last-child { color: var(--neon-green); }
    .dg-eqp-k { flex: 0 0 34px; color: var(--text-dim); }
    .dg-eqp-total { margin-top: 4px; font-size: 10px; color: var(--text-dim); line-height: 1.6; }
    .dg-eq-up { color: var(--neon-green); }
    .dg-eq-down { color: var(--neon-pink); }
    .dg-eq-same { color: var(--text-dim); }
    .dg-eqp-btns { display: flex; gap: 8px; margin-top: 7px; }
    .dg-eqp-btns .btn { flex: 1; min-height: 44px; }
    .dg-skillbar { display: flex; gap: 10px; justify-content: center; margin: 8px 0 4px; }
    .dg-skill { position: relative; min-width: 82px; min-height: 48px; padding: 6px 8px; border-radius: 10px; cursor: pointer;
      color: var(--neon-cyan); background: rgb(var(--nc-cyan-rgb) / .06); border: 1px solid rgb(var(--nc-cyan-rgb) / .4);
      font-family: inherit; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
    .dg-skill:hover:not(:disabled) { box-shadow: 0 0 12px -2px rgb(var(--nc-cyan-rgb) / .6); }
    .dg-skill:disabled { opacity: .9; cursor: default; }
    .dg-skill .dg-sk-key { font-family: var(--font-pixel); font-size: 9px; color: var(--neon-yellow); }
    .dg-skill .dg-sk-name { font-size: 11px; letter-spacing: .5px; }
    .dg-skill .dg-sk-cd { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      border-radius: 9px; background: var(--nc-stage-2); color: var(--text-main); font-family: var(--font-pixel); font-size: 13px; padding: 3px; text-align: center; }
    .dg-skill.cooling .dg-sk-cd, .dg-skill.locked .dg-sk-cd { display: flex; }
    .dg-skill.locked { color: var(--text-dim); border-color: rgba(24,32,52,.2); background: rgba(24,32,52,.03); }
    .dg-skill.locked .dg-sk-cd { font-size: 8px; letter-spacing: 0; color: var(--text-dim); line-height: 1.3; }
    #dg-dpad { display: flex; justify-content: center; margin: 8px 0 2px; }
    #dg-dpad .dpad { margin: 0 auto; }
    .dg-overlay { overflow: auto; }
    .dg-pause { overflow: auto; }
    .dg-ov-btns { gap: 8px; }
    .dg-ov-btns .btn { min-height: 44px; }
    .dg-newrec { color: var(--neon-green); }
    @media (max-width: 480px) {
      .dg-top { font-size: 11px; }
      .dg-top .dg-lbl { font-size: 9px; }
      .dg-ov-title { font-size: 14px; }
      .dg-ov-sub { font-size: 12px; line-height: 1.6; }
      .dg-overlay { gap: 7px; padding: 9px; }
      .dg-hpbar { width: 44px; }
      .dg-menu { padding: 8px; }
      .dg-menu-title { font-size: 12px; }
      .dg-class .dg-cn { font-size: 10px; }
      .dg-class .dg-cs { font-size: 8px; }
      .dg-class .dg-ck { font-size: 8px; }
      .dg-skill { min-width: 74px; min-height: 48px; }
    }
    @media (max-width: 340px) {
      .dg-class .dg-cs { display: none; }
      .dg-class { min-height: 52px; }
      .dg-skill { min-width: 68px; }
      .dg-eq-sum { font-size: 9px; }
    }
  </style>
