  <style>
    .pb-wrap { width: min(400px, 92vw); margin: 0 auto; padding: 4px 0 14px; text-align: center; }
    .pixelbird-stage, .pb-stage { position: relative; width: 100%; }
    .pb-canvas { display: block; width: 100%; height: auto; aspect-ratio: 400/500;
      max-width: 100%; border-radius: 12px; touch-action: none; cursor: pointer;
      box-shadow: 0 0 20px rgba(0,240,255,0.12); }
    .pb-pause { position: absolute; right: 8px; top: 8px; z-index: 6;
      width: 44px; height: 44px; min-width: 44px; min-height: 44px;
      border-radius: 8px; border: 1px solid rgba(0,240,255,0.45);
      background: rgba(6,12,24,0.72); color: var(--neon-cyan);
      font-family: var(--font-pixel); font-size: 13px; cursor: pointer; }
    .pb-pause[hidden] { display: none; }
    .pb-overlay { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; gap: 8px; padding: 14px 12px;
      overflow-y: auto; overscroll-behavior: contain;
      background: linear-gradient(165deg, rgba(5,8,18,0.95), rgba(18,8,32,0.94));
      border-radius: 12px; border: 1px solid rgba(0,240,255,0.22); box-sizing: border-box;
      text-align: center; }
    .pb-overlay[hidden], .pb-pause-veil[hidden] { display: none; }
    .pb-title { font-family: var(--font-pixel); font-size: 18px; line-height: 1.4;
      color: var(--neon-pink); text-shadow: 0 0 14px rgba(255,45,149,0.8); letter-spacing: 1px; }
    .pb-sub { font-size: 11px; color: var(--text-dim); line-height: 1.6; }
    .pb-bestline { font-size: 11px; color: var(--neon-yellow); font-family: var(--font-pixel);
      line-height: 1.6; }
    .pb-daily { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 2px;
      padding: 7px 9px; border-radius: 8px; background: rgba(255,230,0,0.06);
      border: 1px solid rgba(255,230,0,0.28); font-size: 10px; color: var(--text-dim); line-height: 1.5; }
    .pb-daily b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 10px; }
    .pb-daily span { color: var(--text-main); }
    .pb-daily em { font-style: normal; color: var(--neon-green); }
    .pb-missions { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 4px; }
    .pb-task { display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 5px 9px; border-radius: 6px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08); font-size: 10px; color: var(--text-dim); line-height: 1.4; }
    .pb-task em { font-style: normal; color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 9px; }
    .pb-task.done { border-color: rgba(57,255,20,0.5); color: var(--neon-green); }
    .pb-task.done em { color: var(--neon-green); }
    .pb-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 3px; }
    .pb-btns .btn { min-height: 44px; min-width: 110px; }
    .pb-how { font-size: 10px; color: var(--text-dim); line-height: 1.6; max-width: 320px; }
    .pb-scorebig { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: var(--text-dim); }
    .pb-scorebig b { font-family: var(--font-pixel); font-size: 26px; color: var(--neon-yellow);
      text-shadow: 0 0 12px rgba(255,230,0,0.7); }
    .pb-res-line { font-size: 10px; color: var(--text-dim); line-height: 1.5; }
    .pb-medal { font-size: 11px; color: var(--neon-green); font-family: var(--font-pixel);
      line-height: 1.5; }
    .pb-pause-veil { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; padding: 18px;
      background: rgba(7,7,13,0.9); border-radius: 12px; text-align: center; }
    .pb-firehud { display: flex; align-items: center; justify-content: center; gap: 8px;
      width: fit-content; max-width: 100%; margin: 8px auto 0; padding: 3px 4px 3px 10px;
      border-radius: 10px; border: 1px solid rgba(255,45,149,0.3);
      background: rgba(255,45,149,0.08); }
    .pb-firehud[hidden] { display: none; }
    .pb-ammo { display: flex; gap: 4px; }
    .pb-ammo i { display: block; width: 9px; height: 12px; border-radius: 2px;
      background: #ff2d95; box-shadow: 0 0 6px rgba(255,45,149,0.7); }
    .pb-ammo i.off { background: rgba(255,255,255,0.14); box-shadow: none; }
    .pb-fire { display: block; min-width: 96px; min-height: 44px; margin: 0;
      padding: 0 12px; border-radius: 8px; box-sizing: border-box;
      border: 1px solid rgba(255,45,149,0.55); background: rgba(255,45,149,0.14);
      color: var(--neon-pink); font-family: var(--font-pixel); font-size: 12px;
      letter-spacing: 1px; cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; }
    .pb-fire:active { background: rgba(255,45,149,0.3); }
    .pb-fire.empty { color: var(--text-dim); border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04); }
    .pb-fire:disabled { opacity: .45; cursor: default; }
    .pb-taskbar { display: flex; flex-direction: column; gap: 4px; margin: 8px 2px 4px; }
    .pb-taskbar .pb-task { justify-content: space-between; }
    .pb-help { font-size: 10px; color: var(--text-dim); line-height: 1.7;
      background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px; text-align: left; }
    @media (max-width: 420px) {
      .pb-wrap { width: 100%; padding: 4px 6px 12px; }
      .pb-title { font-size: 15px; }
      .pb-overlay { padding: 10px 9px; gap: 6px; }
      .pb-daily, .pb-missions, .pb-taskbar { max-width: 100%; }
      .pb-btns .btn { min-width: 96px; }
    }
  </style>
