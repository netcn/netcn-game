  <style>
    .cr-wrap { padding: 10px 12px 16px; width: min(560px, 96vw); text-align: center; margin: 0 auto; }
    .cr-stage { position: relative; border-radius: 10px; overflow: hidden; }
    .cr-canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #0d1626;
      box-shadow: var(--ui-shadow); touch-action: none; cursor: crosshair; max-width: 100%; }
    .cr-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 3px 10px;
      font-size: 12px; color: var(--text-dim); margin: 6px 2px; }
    .cr-top b { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 11px; }
    .cr-msg { min-height: 18px; font-size: 12px; color: var(--neon-green); margin: 6px 0; line-height: 1.5; }
    .cr-screen { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; gap: 8px; padding: 12px 10px;
      border-radius: 10px; background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      border: 1px solid rgba(0,240,255,0.25); box-sizing: border-box; z-index: 2;
      overflow-y: auto; overscroll-behavior: contain; }
    .cr-screen.hidden { display: none; }
    .cr-screen-title { font-family: var(--font-pixel); font-size: 13px; color: var(--text-main);
      text-shadow: 0 0 12px rgba(0,240,255,0.6); line-height: 1.4; margin-top: 2px; }
    .cr-screen-sub { font-size: 10px; color: var(--text-dim); line-height: 1.6; max-width: 330px; }
    .cr-chapters { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 100%; }
    .cr-tab { min-height: 44px; min-width: 62px; padding: 4px 8px; font-family: var(--font-pixel);
      font-size: 10px; color: var(--text-dim); background: rgba(0,240,255,0.04);
      border: 1px solid rgba(0,240,255,0.22); border-radius: 6px; cursor: pointer; }
    .cr-tab.active { color: var(--neon-cyan); border-color: var(--neon-cyan);
      background: rgba(0,240,255,0.1); box-shadow: var(--ui-shadow); }
    .cr-level-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;
      width: 100%; max-width: 360px; }
    .cr-level-btn { padding: 4px 2px !important; font-size: 12px !important; min-height: 44px;
      min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; line-height: 1; }
    .cr-level-btn.cleared { color: var(--neon-green); border-color: rgba(57,255,20,0.65); }
    .cr-dots { display: flex; gap: 2px; }
    .cr-dots i { display: block; width: 4px; height: 4px; border-radius: 50%;
      background: rgba(24,32,52,0.28); }
    .cr-dots i.on { background: var(--neon-green); box-shadow: 0 0 5px var(--neon-green); }
    .cr-screen-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 2px; }
    .cr-res-grid { display: flex; flex-direction: column; gap: 4px; min-width: 210px;
      background: rgba(24,32,52,0.04); border-radius: 10px; padding: 8px 14px; }
    .cr-res-row { display: flex; justify-content: space-between; gap: 22px; font-size: 12px;
      color: var(--text-dim); }
    .cr-res-row b { color: var(--neon-cyan); font-weight: 600; }
    .cr-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin: 8px 0 2px; }
    .cr-tool { min-height: 48px; display: flex; align-items: center; justify-content: center;
      gap: 7px; padding: 6px 4px; border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(0,240,255,0.28); background: rgba(0,240,255,0.05);
      color: var(--text-dim); font-family: var(--font-pixel); font-size: 10px; }
    .cr-tool.active { color: var(--neon-cyan); border-color: var(--neon-cyan);
      box-shadow: var(--ui-shadow); }
    .cr-tool span { line-height: 1.3; }
    .cr-tool em { font-style: normal; color: var(--neon-yellow); font-size: 11px; min-width: 16px; }
    .cr-ico { display: inline-block; width: 18px; height: 18px; position: relative; flex: 0 0 18px; }
    .cr-ico-cut::before { content: ''; position: absolute; left: 2px; top: 8px; width: 14px;
      height: 2px; background: currentColor; box-shadow: 0 0 6px currentColor; }
    .cr-ico-cut::after { content: ''; position: absolute; left: 7px; top: 4px; width: 4px;
      height: 10px; border-left: 1px solid currentColor; border-right: 1px solid currentColor;
      transform: skewX(-18deg); opacity: 0.7; }
    .cr-ico-freeze::before { content: ''; position: absolute; left: 8px; top: 1px; width: 2px;
      height: 16px; background: currentColor; box-shadow: 0 0 6px currentColor; }
    .cr-ico-freeze::after { content: ''; position: absolute; left: 1px; top: 8px; width: 16px;
      height: 2px; background: currentColor; transform: rotate(45deg);
      box-shadow: 0 0 6px currentColor; }
    .cr-ico-hook::before { content: ''; position: absolute; left: 4px; top: 3px; width: 9px;
      height: 9px; border: 2px solid currentColor; border-radius: 50%; border-right-color: transparent;
      border-bottom-color: transparent; transform: rotate(-45deg); }
    .cr-ico-hook::after { content: ''; position: absolute; left: 8px; top: 1px; width: 1px;
      height: 9px; background: currentColor; }
    .cr-level-btn:focus-visible, .cr-tool:focus-visible, .cr-tab:focus-visible { outline: 2px solid var(--neon-cyan); outline-offset: 2px; }
    @media (max-width: 420px) {
      .cr-wrap { padding: 6px 8px 12px; width: 100%; }
      .cr-top { font-size: 11px; gap: 2px 7px; }
      .cr-tool { font-size: 9px; gap: 4px; }
      .cr-level-btn { font-size: 11px !important; }
      .cr-screen { gap: 6px; padding: 8px 8px; }
      .cr-screen-title { font-size: 11px; line-height: 1.3; margin-top: 0; }
      .cr-chapters, .cr-level-grid { gap: 4px; }
    }
    @media (max-width: 340px) {
      .cr-level-grid { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
