    .m3-stage { width: 100%; display: flex; flex-direction: column; align-items: center; }

    .m3-stars-total { margin-top: 8px; font-family: var(--font-pixel); font-size: 9px; letter-spacing: 1px; text-align: center; color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 230, 0, 0.4); }

    @keyframes m3spin { to { transform: rotate(360deg); } }

    .m3-chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    .m3-boost:hover { transform: translateY(-1px); }

    .m3-ic { width: 14px; height: 14px; display: inline-block; }

    .ic-shuffle { background: linear-gradient(135deg, #00f0ff, #39ff14); border-radius: 50% 0 50% 0; box-shadow: 0 0 8px rgba(0,240,255,.5); }
    .m3-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 54vh; overflow-y: auto; padding: 2px; }
    .m3-lv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 74px; padding: 4px 2px; border-radius: 11px; border: 1px solid rgba(0,240,255,.35); background: rgba(0,240,255,.07); color: var(--text); cursor: pointer; transition: transform .12s ease, box-shadow .18s ease; }
