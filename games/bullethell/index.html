  <style>
    .bh-wrap { width: min(420px, 100%); margin: 0 auto; }

    }
    .bh-banner.show { opacity: 1; transform: none; }

      box-shadow: 0 0 36px rgba(0,240,255,.18), inset 0 0 24px rgba(255,45,149,.06);

    .bh-card h2 { margin: 0; font-family: var(--font-pixel); font-size: 15px; letter-spacing: 1px; color: var(--neon-cyan); text-shadow: 0 0 14px rgba(0,240,255,.5); }
    .bh-card h2.win { color: var(--neon-green); text-shadow: 0 0 14px rgba(57,255,20,.55); }
    .bh-card h2.lose { color: var(--neon-pink); text-shadow: 0 0 14px rgba(255,45,149,.55); }

    .bh-res-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .bh-res-stat {
      display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 7px 9px;

      background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 7px;

    .bh-res-stat b { font-family: var(--font-pixel); font-size: 12px; color: var(--neon-cyan); }
    .bh-res-stat.wide { grid-column: 1 / -1; }
    .bh-res-stat.wide b { color: var(--neon-yellow); }
    .bh-record { display: none; font-family: var(--font-pixel); font-size: 11px; letter-spacing: .08em; color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255,230,0,.7); }
