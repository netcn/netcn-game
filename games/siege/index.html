  <style>
    .sg-wrap { padding: 12px 10px 20px; width: min(540px, 100%); text-align: center; }
    .sg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sg-turn { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-cyan); white-space: nowrap; text-shadow: 0 0 8px rgba(0,240,255,0.45); }
    .sg-turn.red { color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,45,149,0.5); }
    .sg-hud { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px 9px; font-size: 10px; color: var(--text-dim); }
    .sg-hud b { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 10px; }
    .sg-btn { font-family: inherit; font-size: 11px; min-height: 44px; min-width: 44px; padding: 7px 10px; border-radius: 7px; border: 1px solid rgba(0,240,255,0.3); background: rgba(255,255,255,0.05); color: var(--text); cursor: pointer; white-space: nowrap; }
    .sg-btn:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.28); }
    .sg-btn:disabled { opacity: 0.45; }
    .sg-canvas { display: block; width: 100% !important; max-width: 480px; height: auto !important; margin: 0 auto; border-radius: 14px; background: #070b17; box-shadow: 0 0 0 1px rgba(0,240,255,0.18), 0 14px 36px rgba(0,0,0,0.6), 0 0 26px rgba(0,240,255,0.08); touch-action: none; }
    .sg-msg { min-height: 18px; font-size: 12px; line-height: 1.5; color: var(--neon-green); margin: 7px 0 2px; }
    .sg-actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; margin-top: 4px; }
    .sg-tip { flex: 1 1 100%; font-size: 10px; color: var(--text-dim); min-height: 14px; }
    .sg-overlay .sg-panel { background: linear-gradient(160deg, rgba(18,28,46,0.98), rgba(8,12,22,0.98)); border: 1px solid rgba(0,240,255,0.3); border-radius: 16px; padding: 22px 18px; width: min(420px, 94vw); box-shadow: 0 20px 60px rgba(0,0,0,0.75), 0 0 30px rgba(0,240,255,0.1); }
    .sg-title { font-family: var(--font-pixel); font-size: 15px; line-height: 1.6; color: var(--neon-cyan); margin-bottom: 14px; letter-spacing: 1px; text-shadow: 0 0 14px rgba(0,240,255,0.45); }
    .sg-title.win { color: var(--neon-green); text-shadow: 0 0 16px rgba(57,255,20,0.6); }
    .sg-title.fail { color: var(--neon-pink); text-shadow: 0 0 16px rgba(255,45,149,0.55); }
    .sg-sub { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin-bottom: 14px; }
    .sg-diffs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .sg-diff { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left; min-height: 44px; padding: 9px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: var(--text); cursor: pointer; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; }
    .sg-diff strong { font-size: 12px; color: var(--text); }
    .sg-diff span { font-size: 10px; color: var(--text-dim); }
    .sg-diff:hover { border-color: rgba(0,240,255,0.55); }
    .sg-diff.active { border-color: var(--neon-cyan); background: rgba(0,240,255,0.1); box-shadow: 0 0 14px rgba(0,240,255,0.25); }
    .sg-diff.active strong { color: var(--neon-cyan); }
    .sg-res-stats { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.6; }
    .sg-res-stats b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 13px; }
    .sg-res-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    /* 法术栏 · 触控目标 ≥44px */
    .sg-spells { display: flex; justify-content: center; gap: 8px; margin: 6px 0 2px; flex-wrap: wrap; transition: opacity .2s ease; }
    .sg-spells.disabled { opacity: .35; pointer-events: none; }
    .sg-spell { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(155,107,255,.4); background: rgba(155,107,255,.09); color: var(--text); font-family: inherit; font-size: 11px; cursor: pointer; transition: transform .12s ease, box-shadow .2s ease, border-color .15s ease; }
    .sg-spell:hover { transform: translateY(-1px); box-shadow: 0 0 14px rgba(155,107,255,.35); }
    .sg-spell b { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-yellow); }
    .sg-spell.armed { border-color: var(--neon-yellow); background: rgba(255,230,0,.14); box-shadow: 0 0 18px rgba(255,230,0,.5); }
    .sg-spell.empty { opacity: .35; cursor: not-allowed; }
    .sg-spell:disabled { cursor: not-allowed; }
    .sg-ic { width: 15px; height: 15px; display: inline-block; flex: none; }
    .sg-ic-bolt { background: linear-gradient(135deg, #d9c4ff, #9b6bff 55%, #5b21b6); clip-path: polygon(58% 0, 20% 55%, 46% 55%, 36% 100%, 82% 40%, 54% 40%); filter: drop-shadow(0 0 4px rgba(155,107,255,.8)); }
    .sg-ic-shield { background: linear-gradient(160deg, #d8ffd0, #39ff14 60%, #127a05); clip-path: polygon(50% 0, 100% 22%, 88% 78%, 50% 100%, 12% 78%, 0 22%); filter: drop-shadow(0 0 4px rgba(57,255,20,.75)); }
    .sg-ic-rally { background: linear-gradient(160deg, #d6fbff, #00f0ff 60%, #006b7a); clip-path: polygon(50% 0, 64% 34%, 100% 40%, 72% 64%, 82% 100%, 50% 80%, 18% 100%, 28% 64%, 0 40%, 36% 34%); filter: drop-shadow(0 0 4px rgba(0,240,255,.75)); }
    /* 战役地图 */
    .sg-missions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 52vh; overflow-y: auto; padding: 2px; }
    .sg-mission { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 6px 4px; border-radius: 10px; border: 1px solid rgba(0,240,255,.35); background: rgba(0,240,255,.07); color: var(--text); font-family: inherit; cursor: pointer; transition: transform .12s ease, box-shadow .18s ease; }
    .sg-mission:hover { transform: translateY(-2px); box-shadow: 0 0 16px rgba(0,240,255,.25); }
    .sg-mission b { font-family: var(--font-pixel); font-size: 13px; color: var(--neon-cyan); }
    .sg-mission span { font-size: 10px; color: var(--text); line-height: 1.3; text-align: center; }
    .sg-mission em { font-style: normal; font-size: 9px; color: var(--text-dim); }
    .sg-mission.done { border-color: var(--neon-green); background: rgba(57,255,20,.1); }
    .sg-mission.done b { color: var(--neon-green); }
    .sg-mission.locked { opacity: .4; cursor: not-allowed; }
    /* 遮罩内共用按钮同样满足 44px 触控目标 */
    #sg-menu .btn, #sg-res-btns .btn, #sg-pause-ov .btn, #sg-campaign-close { min-height: 44px; }
    @media (max-width: 420px) {
      .sg-wrap { padding-left: 6px; padding-right: 6px; }

      .sg-turn { font-size: 10px; }
      .sg-btn { font-size: 10px; padding: 6px 8px; }
      .sg-actions { gap: 5px; }
      .sg-title { font-size: 13px; }
    }
