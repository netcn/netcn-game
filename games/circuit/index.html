    .ci-wrap { box-sizing: border-box; padding: 10px 8px 18px; width: min(540px, 100%); text-align: center; margin: 0 auto; }
    .ci-head { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-dim); margin: 0 2px 8px; }
    .ci-head span { white-space: nowrap; }
    .ci-stage { position: relative; }
    .ci-canvas { width: 100% !important; height: auto !important; border-radius: 14px; background: #050d15;
      box-shadow: var(--ui-shadow);
      touch-action: none; max-width: 100%; display: block; }
    .ci-paused { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--nc-stage-2); color: #8ffcff; font-size: 20px; letter-spacing: 2px;
      border-radius: 14px; text-shadow: 0 0 16px rgb(var(--nc-cyan-rgb) / 0.7); }
    .ci-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--nc-stage-2); backdrop-filter: blur(5px); border-radius: 14px; padding: 12px; z-index: 3; }
    .ci-overlay.hidden, .ci-paused.hidden { display: none !important; }
    .ci-ov-card { width: min(340px, 88%); background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      border: 1px solid rgb(var(--nc-cyan-rgb) / 0.35); border-radius: 14px; padding: 16px 14px;
      box-shadow: var(--ui-shadow); }
    .ci-ov-title { font-family: var(--font-pixel); font-size: 16px; line-height: 1.5; letter-spacing: .5px;
      color: #9ffcff; margin-bottom: 10px; text-shadow: 0 0 14px rgb(var(--nc-cyan-rgb) / 0.55); }
    .ci-ov-stats { font-size: 13px; color: var(--text-main); line-height: 1.8; }
    .ci-ov-score { margin-top: 8px; font-size: 16px; color: #ffe27a; }
    .ci-ov-best { font-size: 12px; color: var(--text-dim); margin: 4px 0 12px; }
    .ci-ov-btns { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .ci-msg { min-height: 18px; font-size: 13px; color: var(--neon-green); margin: 8px 0 2px; }
    .ci-levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 2px 0; }
    .ci-lv { appearance: none; border: 1px solid rgb(var(--nc-cyan-rgb) / 0.22); background: var(--nc-stage-2);
      color: var(--text-dim); border-radius: 8px; padding: 7px 0; font-size: 12px; cursor: pointer;
      transition: border-color .15s, color .15s, box-shadow .15s; }
    .ci-lv:hover { border-color: rgb(var(--nc-cyan-rgb) / 0.55); color: #bff8ff; }
