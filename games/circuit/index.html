      border-radius: 14px; text-shadow: 0 0 16px rgba(0,240,255,0.7); }
    .ci-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

    .ci-overlay.hidden, .ci-paused.hidden { display: none !important; }
    .ci-ov-card { width: min(340px, 88%); background: linear-gradient(160deg, rgba(12,40,54,0.95), rgba(5,18,26,0.96));

    .ci-ov-best { font-size: 12px; color: var(--text-dim); margin: 4px 0 12px; }
    .ci-ov-btns { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .ci-msg { min-height: 18px; font-size: 13px; color: var(--neon-green); margin: 8px 0 2px; }
    .ci-levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 2px 0; }
