  <link rel="stylesheet" href="../../assets/css/shell.css">
  <style>
    /* ============ 纸牌接龙 · 旗舰牌桌 ============ */
    .kl-wrap {
      --kl-cw: 72px; --kl-ch: 102px; --kl-up: 24px; --kl-down: 16px; --kl-gap: 8px;
      padding: 48px 10px 28px; width: min(760px, 100%); text-align: center; position: relative;
    }

    /* ---------- 变体切换 ---------- */
    .kl-vswitch { display: flex; gap: 8px; justify-content: center; margin: 2px 0 14px; }
    .kl-vtab {
      flex: 1 1 0; min-height: 46px; padding: 8px 10px; cursor: pointer;
      border: 1px solid rgba(0,240,255,0.26); border-radius: 10px;
      background: rgba(0,240,255,0.05); color: var(--text-dim);
      font-family: var(--font-pixel); font-size: 10px; line-height: 1.5;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .kl-vtab:hover { color: var(--neon-cyan); border-color: rgba(0,240,255,0.6); }
    .kl-vtab.on {
      color: var(--neon-cyan); border-color: var(--neon-cyan);
      background: linear-gradient(160deg, rgba(0,240,255,0.16), rgba(185,103,255,0.08));
      box-shadow: 0 0 18px rgba(0,240,255,0.28), inset 0 0 12px rgba(0,240,255,0.06);
      text-shadow: 0 0 10px rgba(0,240,255,0.5);
    }
    .kl-vtab:focus-visible { outline: 2px solid var(--accent, #00f0ff); outline-offset: 3px; }
    .kl-fc-desc {
      margin: 4px auto 14px; max-width: 560px; padding: 12px 14px; text-align: left;
      font-size: 12px; line-height: 1.85; color: var(--text-dim);
      border: 1px solid rgba(0,240,255,0.18); border-radius: 10px;
      background: rgba(0,240,255,0.04);
    }
    .kl-fc-start { width: 100%; min-height: 52px; }

    /* ---------- 难度选择 ---------- */
    .kl-pick { padding: 2px; }
    .kl-pick-t { font-family: var(--font-pixel); font-size: 15px; line-height: 1.7; letter-spacing: 1px; color: var(--neon-cyan); text-shadow: 0 0 12px rgba(0,240,255,0.5); }
    .kl-pick-d { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin: 8px auto 16px; max-width: 600px; }
    .kl-diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .kl-diff {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
      min-height: 108px; padding: 12px 14px; cursor: pointer; color: var(--text-main);
      background: linear-gradient(160deg, rgba(0,240,255,0.09), rgba(185,103,255,0.06));
      border: 1px solid rgba(0,240,255,0.28); border-radius: 12px; font-family: var(--font-body);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .kl-diff:hover { transform: translateY(-3px); border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,240,255,0.3); }
    .kl-diff:active { transform: scale(0.97); }
    .kl-diff-ic { font-size: 22px; line-height: 1; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6); }
    .kl-diff-ic.red { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,45,149,0.6); }
    .kl-diff:nth-child(3) .kl-diff-ic { color: var(--neon-purple); text-shadow: 0 0 10px rgba(185,103,255,0.6); }
    .kl-diff-name { font-family: var(--font-pixel); font-size: 12px; color: var(--neon-cyan); margin-top: 6px; }
    .kl-diff:nth-child(2) .kl-diff-name { color: var(--neon-yellow); }
    .kl-diff:nth-child(3) .kl-diff-name { color: var(--neon-purple); }
    .kl-diff-d { font-size: 11px; color: var(--text-dim); line-height: 1.6; }
    .kl-daily {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 56px; padding: 10px 14px; cursor: pointer; border-radius: 12px;
      border: 1px solid rgba(255,230,0,0.45); color: var(--neon-yellow);
      background: linear-gradient(90deg, rgba(255,230,0,0.10), rgba(255,45,149,0.07));
      font-family: var(--font-pixel); font-size: 11px; line-height: 1.6;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .kl-daily:hover { box-shadow: 0 0 20px rgba(255,230,0,0.35); transform: translateY(-2px); }
    .kl-daily:active { transform: scale(0.98); }
    .kl-daily-state { font-size: 11px; color: var(--text-dim); line-height: 1.7; margin-top: 8px; min-height: 18px; }
    .kl-daily-state.done { color: var(--neon-green); text-shadow: 0 0 10px rgba(57,255,20,0.35); }
    .kl-pick-best { font-family: var(--font-pixel); font-size: 10px; color: var(--neon-yellow); margin-top: 10px; line-height: 1.8; }
    .kl-diff:focus-visible, .kl-daily:focus-visible { outline: 2px solid var(--accent, #00f0ff); outline-offset: 3px; }

    /* ---------- HUD ---------- */
    .kl-hud { display: flex; gap: 6px; align-items: stretch; margin-bottom: 8px; flex-wrap: wrap; }
    .kl-chip {
      display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 5px 9px;
      background: rgba(0,0,0,0.32); border: 1px solid rgba(0,240,255,0.22); border-radius: 8px;
      color: var(--text-dim); font-size: 10px; min-width: 0;
    }
    .kl-chip:first-child { flex: 1 1 150px; justify-content: flex-start; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .kl-chip b { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-cyan); }
    .kl-chip-time b { color: var(--neon-yellow); }
    .kl-chip-ic { font-size: 11px; line-height: 1; display: inline-flex; align-items: center; }
    .kl-chip-ic svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- 牌桌 ---------- */
    .kl-board { position: relative; }
    .kl-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: var(--kl-gap);
      margin-bottom: calc(var(--kl-ch) * 0.10);
      overflow-x: auto; overflow-y: hidden; padding: 2px 0 4px;
      -webkit-overflow-scrolling: touch; scrollbar-width: thin;
    }
    .kl-top::-webkit-scrollbar, .kl-cols-wrap::-webkit-scrollbar { height: 6px; }
    .kl-top::-webkit-scrollbar-thumb, .kl-cols-wrap::-webkit-scrollbar-thumb {
      background: rgba(0,240,255,0.28); border-radius: 4px;
    }
    .kl-found, .kl-stock { display: flex; gap: var(--kl-gap); align-items: flex-start; flex: 0 0 auto; }
    .kl-slot { position: relative; width: max(44px, var(--kl-cw)); height: max(44px, var(--kl-ch)); flex: 0 0 auto; border-radius: calc(var(--kl-cw) * 0.09); }

    .kl-stock-slot { border: 1px dashed rgba(0,240,255,0.18); background: rgba(0,0,0,0.16); }
    .kl-stock-slot::before, .kl-stock-slot::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(145deg, #13233e, #081223);
      border: 1px solid rgba(0,240,255,0.20); pointer-events: none;
    }
    .kl-stock-slot::before { transform: translate(-3px, -3px); opacity: 0.55; }
    .kl-stock-slot::after { transform: translate(-1.5px, -1.5px); opacity: 0.8; }
    .kl-stock-slot.empty::before, .kl-stock-slot.empty::after { display: none; }
    .kl-stock-slot .kl-card { position: absolute; left: 0; top: 0; z-index: 2; }
    .kl-stock-slot.recycle {
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      border: 1px solid rgba(0,240,255,0.45); background: rgba(0,240,255,0.07);
    }
    .kl-stock-slot.recycle:hover { box-shadow: 0 0 16px rgba(0,240,255,0.35); }
    .kl-recycle { font-size: calc(var(--kl-ch) * 0.33); color: var(--neon-cyan); line-height: 1; text-shadow: 0 0 14px rgba(0,240,255,0.7); }

    .kl-waste-slot { border: 1px dashed rgba(255,230,0,0.16); background: rgba(0,0,0,0.16); }
    .kl-waste-slot .kl-card { position: absolute; left: calc(var(--fan, 0) * 5px); top: calc(var(--fan, 0) * 1px); z-index: calc(var(--fan, 0) + 2); }
    .kl-waste-slot .kl-card.fan-behind { pointer-events: none; filter: brightness(0.9); }
    .kl-waste-slot .kl-card.clickable { cursor: pointer; }
    .kl-waste-slot .kl-card.clickable:hover .kl-front { box-shadow: 0 0 0 1px rgba(255,230,0,0.55), 0 0 14px rgba(255,230,0,0.35), 0 2px 6px rgba(0,0,0,0.45); }

    .kl-found-slot {
      display: flex; align-items: center; justify-content: center;
      border: 1px dashed rgba(255,255,255,0.16); background: rgba(0,0,0,0.24);
    }
    .kl-slot-watermark { font-size: calc(var(--kl-ch) * 0.30); color: rgba(255,255,255,0.14); line-height: 1; }
    .kl-found-slot.has { border-style: solid; border-color: rgba(57,255,20,0.42); box-shadow: 0 0 12px rgba(57,255,20,0.16); }
    .kl-found-slot.has .kl-front {
      box-shadow: 0 0 0 1px rgba(57,255,20,0.45), 0 0 14px rgba(57,255,20,0.35), 0 2px 6px rgba(0,0,0,0.42);
    }
    .kl-found-slot .kl-card { position: absolute; left: 0; top: 0; }
    .kl-found-slot.clickable, .kl-slot.clickable { cursor: pointer; }
    .kl-found-slot.drop { border-style: solid; border-color: var(--neon-green); box-shadow: 0 0 18px rgba(57,255,20,0.45); }

    /* FreeCell 空位 */
    .kl-free-slot {
      display: flex; align-items: center; justify-content: center;
      border: 1px dashed rgba(0,240,255,0.26); background: rgba(0,240,255,0.045);
    }
    .kl-free-slot.has { border-style: solid; border-color: rgba(0,240,255,0.52); box-shadow: 0 0 12px rgba(0,240,255,0.18); }
    .kl-free-slot .kl-card { position: absolute; left: 0; top: 0; }
    .kl-free-slot .kl-slot-watermark { color: rgba(0,240,255,0.34); font-family: var(--font-pixel); }
    .kl-free-slot.clickable:hover { border-color: rgba(0,240,255,0.65); box-shadow: 0 0 16px rgba(0,240,255,0.22); }
    .kl-free-slot.kb, .kl-found-slot.kb { outline: 2px dashed rgba(255,255,255,0.8); outline-offset: 2px; }
    .kl-card.kb .kl-front { outline: 2px dashed rgba(255,255,255,0.85); outline-offset: 2px; }
    .kl-col.kb { outline: 2px dashed rgba(255,255,255,0.65); outline-offset: 2px; }
    .kl-stock-slot.kb { outline: 2px dashed rgba(255,255,255,0.75); outline-offset: 2px; }
    .kl-count {
      position: absolute; right: -5px; bottom: -5px; z-index: 4;
      font-family: var(--font-pixel); font-size: 8px; line-height: 1; color: #06170a;
      background: var(--neon-green); border-radius: 6px; padding: 3px 4px;
      box-shadow: 0 0 8px rgba(57,255,20,0.5);
    }
    .kl-stock-slot .kl-count { background: var(--neon-yellow); color: #1a1604; box-shadow: 0 0 8px rgba(255,230,0,0.5); }

    .kl-cols-wrap { overflow-x: auto; overflow-y: hidden; padding: 2px 0 4px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .kl-cols {
      display: grid; grid-template-columns: repeat(var(--kl-ncols, 7), var(--kl-cw));
      gap: var(--kl-gap); width: max-content; margin: 0 auto;
    }
    .kl-col { position: relative; width: var(--kl-cw); height: var(--kl-ch); }
    .kl-col.empty::before {
      content: 'K'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      border: 1px dashed rgba(255,255,255,0.18); background: rgba(0,0,0,0.15);
      border-radius: calc(var(--kl-cw) * 0.09); color: rgba(255,255,255,0.16);
      font-family: var(--font-pixel); font-size: calc(var(--kl-ch) * 0.20);
    }
    .kl-col.empty.clickable { cursor: pointer; }
    .kl-col.empty.fc::before { content: ''; }
    .kl-col.empty.clickable:hover::before { border-color: rgba(0,240,255,0.45); color: rgba(0,240,255,0.5); }
    .kl-col.drop::after {
      content: ''; position: absolute; inset: -3px; pointer-events: none; z-index: 12;
      border-radius: calc(var(--kl-cw) * 0.12);
      box-shadow: inset 0 0 0 1px rgba(57,255,20,0.5), 0 0 16px rgba(57,255,20,0.26);
    }
    .kl-col.drop.empty::before { border-color: rgba(57,255,20,0.6); border-style: solid; color: rgba(57,255,20,0.5); }

    /* ---------- 扑克牌（纯 CSS 牌面 + 3D 翻牌） ---------- */
    .kl-card {
      position: absolute; left: 0; width: var(--kl-cw); height: var(--kl-ch);
      perspective: 700px; border-radius: calc(var(--kl-cw) * 0.09);
      transform-style: preserve-3d; touch-action: manipulation;
    }
    .kl-card-in {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d; transition: transform 0.38s cubic-bezier(0.2,0.8,0.25,1);
    }
    .kl-card.down .kl-card-in { transform: rotateY(180deg); }
    .kl-face {
      position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .kl-front {
      background: linear-gradient(155deg, #fffdf8 0%, #f7f1e3 58%, #e7ddca 100%);
      border: 1px solid rgba(20,20,30,0.28); color: #1a2230;
      box-shadow: 0 2px 7px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .kl-card.red .kl-front { color: #c81f3d; }
    .kl-back {
      transform: rotateY(180deg);
      background:
        repeating-linear-gradient(45deg, rgba(0,240,255,0.16) 0 2px, transparent 2px 7px),
        repeating-linear-gradient(-45deg, rgba(255,45,149,0.12) 0 2px, transparent 2px 7px),
        linear-gradient(145deg, #1a2c4e, #0b1730 60%, #070e1d);
      border: 1px solid rgba(0,240,255,0.45);
      box-shadow: inset 0 0 0 3px rgba(0,0,0,0.28), inset 0 0 16px rgba(0,240,255,0.15), 0 2px 6px rgba(0,0,0,0.5);
    }
    .kl-back::after {
      content: ''; position: absolute; inset: 12%; border: 1px solid rgba(0,240,255,0.26);
      border-radius: calc(var(--kl-cw) * 0.05); pointer-events: none;
    }
    .kl-corner {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      line-height: 1; font-weight: 700; font-family: var(--font-body);
    }
    .kl-corner.tl { top: 6%; left: 8%; }
    .kl-corner.br { bottom: 6%; right: 8%; transform: rotate(180deg); }
    .kl-rank { font-size: calc(var(--kl-ch) * 0.16); letter-spacing: -0.04em; }
    .kl-suit { font-size: calc(var(--kl-ch) * 0.145); margin-top: 2px; }
    .kl-pip {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--kl-ch) * 0.40); opacity: 0.14; pointer-events: none;
    }
    .kl-card.top.up .kl-front { box-shadow: 0 0 0 1px rgba(0,240,255,0.35), 0 0 12px rgba(0,240,255,0.22), 0 2px 6px rgba(0,0,0,0.45); }
    .kl-card.sel { z-index: 10; }
    .kl-card.sel .kl-front {
      box-shadow: 0 0 0 2px var(--neon-yellow), 0 0 18px rgba(255,230,0,0.62), 0 2px 6px rgba(0,0,0,0.45);
      animation: kl-sel-pulse 0.9s ease-in-out infinite alternate;
    }
    .kl-card.kb .kl-front { outline: 2px dashed rgba(255,255,255,0.75); outline-offset: -2px; }
    .kl-card.up.clickable { cursor: pointer; }
    .kl-card.up.clickable:hover .kl-front { box-shadow: 0 0 0 1px rgba(0,240,255,0.65), 0 0 14px rgba(0,240,255,0.35), 0 2px 6px rgba(0,0,0,0.45); }

    /* 发牌 stagger */
    .kl-card.deal { animation: kl-deal 0.44s cubic-bezier(0.2,0.9,0.3,1.1) both; animation-delay: calc(var(--deal-i, 0) * 30ms); }
    @keyframes kl-deal {
      0% { opacity: 0; transform: translate3d(0,-46px,0) rotate(-5deg); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: translate3d(0,0,0) rotate(0); }
    }
    /* 3D 翻牌 */
    .kl-card.flip-in .kl-card-in { animation: kl-flip 0.46s cubic-bezier(0.2,0.75,0.3,1) both; }
    @keyframes kl-flip {
      0% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    /* FLIP 移动过渡 */
    .kl-card.kl-fly { transition: transform 0.30s cubic-bezier(0.2,0.85,0.25,1); will-change: transform; }
    @keyframes kl-sel-pulse {
      from { box-shadow: 0 0 0 2px var(--neon-yellow), 0 0 10px rgba(255,230,0,0.4), 0 2px 6px rgba(0,0,0,0.45); }
      to   { box-shadow: 0 0 0 2px var(--neon-yellow), 0 0 24px rgba(255,230,0,0.85), 0 2px 6px rgba(0,0,0,0.45); }
    }

    /* ---------- 状态 / 操作 / 提示 ---------- */
    .kl-status { display: flex; align-items: center; justify-content: center; gap: 14px; margin: calc(var(--kl-ch) * 0.12) 0 4px; flex-wrap: wrap; }
    .kl-stat { font-size: 12px; color: var(--text-dim); }
    .kl-stat b { font-family: var(--font-pixel); color: var(--neon-green); font-size: 12px; }
    .kl-actions { display: flex; gap: 8px; justify-content: center; margin: 6px 0 4px; flex-wrap: wrap; }

      width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;

    /* 独立提示通道：fixed 层，不参与 paintAll / 重绘 */
    .kl-tip {

    .kl-tip.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

    .kl-card.kl-hint .kl-front { animation: kl-hint-pulse 0.9s ease-in-out infinite; }
    .kl-col.kl-hint::after, .kl-found-slot.kl-hint::after, .kl-free-slot.kl-hint::after {
      content: ''; position: absolute; inset: -4px; z-index: 11; pointer-events: none;

      0%, 100% { opacity: 0.55; }

    .kl-found-slot.kl-pop::after {
      content: ''; position: absolute; inset: -10px; border-radius: inherit; pointer-events: none; z-index: 12;

      animation: kl-found-flash 0.5s ease-out forwards;

    @keyframes kl-found-flash {

    .kl-ghost {

    .kl-board.kl-won { animation: kl-board-win 1.2s ease-out 2; }

    .kl-confetti {
      position: fixed; left: 50%; top: 42%; width: 7px; height: 12px; border-radius: 2px;

    @keyframes kl-confetti {

      100% { opacity: 0; transform: translate(var(--x, 0), var(--y, 45vh)) rotate(var(--r, 360deg)); }
    }

    /* ---------- 结算 ---------- */
    .kl-ov-card {
      width: min(430px, 92vw); padding: 24px 20px; display: flex; flex-direction: column;
      align-items: center; gap: 12px; border-radius: 16px;
      border: 1px solid rgba(57,255,20,0.45);

      box-shadow: 0 0 40px rgba(57,255,20,0.20);
      animation: kl-ov-in 0.4s cubic-bezier(0.2,0.9,0.3,1.2);

    @keyframes kl-ov-in { from { opacity: 0; transform: scale(0.86) translateY(14px); } to { opacity: 1; transform: none; } }
    .kl-ov-badge {
      min-height: 16px; font-family: var(--font-pixel); font-size: 10px; line-height: 1.6;

      animation: kl-badge-pulse 0.8s ease-in-out infinite alternate;

    .kl-ov-badge:empty { animation: none; }
    @keyframes kl-badge-pulse { from { opacity: 0.75; } to { opacity: 1; } }
    .kl-ov-card h2 { font-size: 18px; line-height: 1.6; color: var(--neon-green); text-shadow: 0 0 14px rgba(57,255,20,0.5); }
    .kl-ov-card p { font-size: 12px; }
    .kl-ov-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    .kl-ov-stats > div {
      display: flex; flex-direction: column; gap: 4px; padding: 8px 4px;
      background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.10); border-radius: 10px;
    }
    .kl-ov-stats span { font-size: 10px; color: var(--text-dim); }
    .kl-ov-stats b { font-family: var(--font-pixel); font-size: 12px; color: var(--neon-yellow); }
    .kl-ov-btns { display: flex; gap: 8px; justify-content: center; width: 100%; flex-wrap: wrap; }
    .kl-ov-btns .btn { flex: 1 1 140px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; }

    }
