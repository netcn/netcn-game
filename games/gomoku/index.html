  <style>
    /* ---------- 布局 ---------- */
    #game-root { overflow-x: clip; }
    .gk-wrap { width: 100%; max-width: 660px; margin: 0 auto; box-sizing: border-box; }
    .gk-top { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0 0 8px; }
    .gk-pill {
      display: inline-flex; align-items: center; gap: 6px; min-height: 28px;
      font-size: 11px; color: var(--text-dim); line-height: 1.25; white-space: nowrap;
      border: 1px solid rgba(24,32,52,.12); border-radius: 999px; padding: 4px 10px;
      background: rgba(24,32,52,.03);
    }
    .gk-pill b { font-family: var(--font-pixel); font-size: 10px; color: var(--neon-cyan); }
    .gk-pill.streak b { color: var(--neon-yellow); }
    .gk-pill.best b { color: var(--neon-green); }
    .gk-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .gk-dot.black { background: radial-gradient(circle at 34% 30%, #7a7a7a, #050505 72%); border: 1px solid rgba(24,32,52,.4); }
    .gk-dot.white { background: radial-gradient(circle at 34% 30%, #ffffff, #b9bec9 78%); border: 1px solid rgba(0,0,0,.35); }

    .gk-board-wrap { position: relative; width: 100%; max-width: 600px; margin: 0 auto; }
    .gomoku-canvas {
      width: 100%; max-width: 100%; height: auto; display: block; margin: 0 auto;
      cursor: crosshair; border-radius: 12px;
      box-shadow: var(--ui-shadow);
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    .gomoku-canvas.thinking { animation: gkThink 1.1s ease-in-out infinite; }
    @keyframes gkThink {
      50% { box-shadow: var(--ui-shadow); filter: brightness(1.1); }
    }
    .gk-badge {
      position: absolute; left: 8px; top: 8px; pointer-events: none;
      font-family: var(--font-pixel); font-size: 9px; line-height: 1.4; color: var(--neon-yellow);
      background: var(--nc-stage-2); border: 1px solid rgba(255,230,0,.45); border-radius: 6px;
      padding: 4px 8px; max-width: calc(100% - 16px); text-shadow: 0 0 6px rgba(255,230,0,.5);
    }
    .gk-badge[hidden] { display: none; }
    .gk-badge .sub { display: block; font-family: inherit; font-size: 8px; color: var(--text-dim); text-shadow: none; }

    .gk-sub { min-height: 17px; font-size: 11px; line-height: 1.6; color: var(--text-dim); text-align: center; margin: 7px 0 0; }

    .gk-modes { gap: 8px; margin: 10px 0 6px; }
    .gk-modes .mode-btn { min-height: 44px; min-width: 76px; font-size: 11px; padding: 8px 11px; }
    .gk-modes .mode-btn.gk-puzzle-btn { border-color: rgba(185,103,255,.6); color: var(--neon-purple); }
    .gk-acts { gap: 8px; margin: 8px 0 2px; }
    .gk-acts .btn { min-height: 44px; font-size: 11px; padding: 9px 14px; }
    .gk-modal .game-controls .btn { min-height: 44px; }
    #undo-btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
    #forbidden-btn[aria-pressed="true"] {
      color: var(--neon-pink); border-color: var(--neon-pink);
      box-shadow: 0 0 14px rgba(255,45,149,.55), inset 0 0 10px rgba(255,45,149,.16);
      text-shadow: 0 0 8px rgba(255,45,149,.7);
    }
    #forbidden-btn[hidden] { display: none; }
    .gk-modes.gk-flash { animation: gkFlash 1.4s ease; border-radius: 10px; }
    @keyframes gkFlash {
      0%, 100% { box-shadow: none; }
      45% { box-shadow: var(--ui-shadow); }
    }
    .gk-keyhint { text-align: center; font-size: 10px; line-height: 1.7; color: var(--text-dim); margin-top: 8px; opacity: .9; }
    .gs-streak.on { color: var(--neon-yellow); text-shadow: 0 0 10px rgba(255,230,0,.7); }

    /* ---------- 结算 / 选题目 浮层 ---------- */
    .gk-overlay {
      position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center;
      background: var(--nc-stage-2); padding: 14px;
    }
    .gk-overlay.hidden { display: none; }
    .gk-modal {
      width: min(430px, 100%); max-height: 88vh; overflow-y: auto; box-sizing: border-box;
      background: var(--bg-panel); border: 1px solid rgba(0,240,255,.55); border-radius: 12px;
      padding: 18px 16px; text-align: center; box-shadow: var(--ui-shadow);
    }
    .gk-res-title { font-family: var(--font-pixel); font-size: 15px; line-height: 1.6; color: var(--neon-cyan); margin-bottom: 6px; }
    .gk-res-title.win { color: var(--neon-green); text-shadow: 0 0 12px rgba(57,255,20,.6); }
    .gk-res-title.lose { color: var(--neon-pink); text-shadow: 0 0 12px rgba(255,45,149,.6); }
    .gk-res-title.draw { color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255,230,0,.6); }
    .gk-res-sub { font-size: 11px; line-height: 1.75; color: var(--text-dim); min-height: 18px; margin-bottom: 8px; }
    .gk-res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 14px; }
    .gk-res-grid > div { border: 1px solid rgba(24,32,52,.12); border-radius: 8px; padding: 7px 8px; font-size: 11px; color: var(--text-dim); line-height: 1.4; text-align: left; }
    .gk-res-grid b { display: block; font-family: var(--font-pixel); font-size: 13px; color: var(--neon-yellow); margin-top: 3px; }
    .gk-res-grid .rec b { color: var(--neon-green); }
    .gk-res-actions { gap: 8px; margin: 0; }
    .gk-res-actions .btn { flex: 1 1 92px; min-height: 44px; font-size: 10px; padding: 10px 8px; }

    .gk-pk-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 14px; }
    .gk-pk {
      display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 7px 9px; box-sizing: border-box;
      border: 1px solid rgba(0,240,255,.35); border-radius: 8px; background: rgba(0,240,255,.06);
      color: var(--text-main); font-family: inherit; font-size: 11px; text-align: left; cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .12s;
    }
    .gk-pk:hover { border-color: var(--neon-cyan); box-shadow: var(--ui-shadow); }
    .gk-pk:active { transform: scale(.97); }
    .gk-pk .tierbar { width: 5px; height: 20px; border-radius: 2px; flex: 0 0 auto; background: var(--neon-cyan); }
    .gk-pk.t2 .tierbar { background: var(--neon-yellow); }
    .gk-pk.t3 .tierbar { background: var(--neon-pink); }
    .gk-pk .num { font-family: var(--font-pixel); font-size: 10px; color: var(--neon-cyan); }
    .gk-pk .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .gk-pk .meta small { font-size: 9px; color: var(--text-dim); }
    .gk-pk .st { margin-left: auto; font-size: 9px; color: var(--text-dim); white-space: nowrap; }
    .gk-pk.done { border-color: rgba(57,255,20,.5); background: rgba(57,255,20,.06); }
    .gk-pk.done .st { color: var(--neon-green); }
    .gk-pk.cur { box-shadow: 0 0 0 2px rgba(255,230,0,.5) inset; }
    @media (max-width: 420px) {
      .gk-modes .mode-btn { min-width: 70px; font-size: 10px; padding: 7px 9px; }
      .gk-pill { font-size: 10px; padding: 4px 8px; }
      .gk-badge { font-size: 8px; }
      .gk-res-title { font-size: 13px; }
      .gk-res-grid b { font-size: 11px; }
      .gk-pk-list { gap: 6px; }
      .gk-pk { min-height: 44px; padding: 6px 7px; gap: 6px; font-size: 10px; }
    }
  </style>
</head>
