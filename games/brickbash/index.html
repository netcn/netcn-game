  <style>
    .bb-wrap{width:min(420px,96vw);margin:0 auto;padding-bottom:4px;text-align:center;}
    .bb-pick{padding:24px 10px 18px;}
    .bb-pick-t{font-family:var(--font-pixel);font-size:17px;letter-spacing:2px;color:var(--neon-pink);text-shadow:0 0 14px rgba(255,45,149,0.6);}
    .bb-pick-d{font-size:12px;color:var(--text-dim);line-height:1.8;margin:10px auto 18px;max-width:330px;}
    .bb-pick-btns{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto;}
    .bb-diff-btn{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:10px 14px;border-radius:10px;}
    .bb-diff-btn b{font-family:var(--font-pixel);font-size:12px;letter-spacing:1px;}
    .bb-diff-btn small{font-size:10px;color:var(--text-dim);font-family:var(--font-mono);}
    .bb-hud{display:flex;justify-content:center;gap:6px;margin:8px 0 4px;}
    .bb-stat{flex:1 1 0;max-width:92px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:8px;background:rgba(0,240,255,0.05);border:1px solid rgba(0,240,255,0.16);}
    .bb-stat i{font-style:normal;font-size:9px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;}
    .bb-stat b{font-family:var(--font-pixel);font-size:12px;color:var(--neon-cyan);text-shadow:0 0 8px rgba(0,240,255,0.45);white-space:nowrap;}
    #lives{padding-top:1px;}
    .bb-lives{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-height:13px;}
    .bb-heart{display:inline-block;width:13px;height:12px;background:var(--neon-pink);clip-path:polygon(50% 100%,10% 60%,0% 36%,6% 14%,24% 5%,42% 10%,50% 22%,58% 10%,76% 5%,94% 14%,100% 36%,90% 60%);filter:drop-shadow(0 0 4px rgba(255,45,149,0.85));transition:background .18s ease,filter .18s ease,transform .18s ease;}
    .bb-heart.off{background:rgba(255,255,255,0.14);filter:none;transform:scale(0.86);}
    .bb-shield-stat b{font-size:10px;color:var(--text-dim);}
    .bb-shield-stat b.on{color:var(--neon-green);text-shadow:0 0 8px rgba(57,255,20,0.65);}
    .bb-wrap .btn{min-height:44px;}
    .bb-combo b{color:var(--neon-yellow);text-shadow:0 0 8px rgba(255,230,0,0.5);}
    .bb-combo.off{opacity:0.45;}
    .bb-game .game-message{font-size:11px;margin:5px 0 7px;min-height:16px;}
    .brickbash-stage{position:relative;width:100%;max-width:400px;margin:0 auto;filter:drop-shadow(0 0 18px rgba(0,240,255,0.14));}
    .brickbash-stage canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:12px;border:1px solid rgba(0,240,255,0.38);background:#07070d;touch-action:none;box-shadow:0 0 0 1px rgba(255,45,149,0.14),0 0 26px rgba(0,240,255,0.18),0 0 60px rgba(255,45,149,0.1);}
    .bb-banner{position:absolute;left:50%;top:23%;transform:translate(-50%,12px) scale(0.82);opacity:0;z-index:4;pointer-events:none;white-space:nowrap;text-align:center;font-family:var(--font-pixel);font-size:14px;letter-spacing:2px;color:var(--neon-yellow);text-shadow:0 0 14px currentColor,0 0 30px currentColor;padding:9px 16px;border-radius:12px;background:rgba(6,8,16,0.88);border:1px solid currentColor;box-shadow:0 0 24px currentColor;transition:opacity .28s ease,transform .28s cubic-bezier(.2,1.5,.4,1);}
    .bb-banner.show{opacity:1;transform:translate(-50%,0) scale(1);}
    .bb-banner small{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--neon-cyan);margin-top:5px;}
    .bb-pause{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(6,8,16,0.8);border-radius:12px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
    .bb-pause.hidden{display:none;}
    .bb-card{width:min(310px,92%);padding:16px 14px;border-radius:14px;display:flex;flex-direction:column;gap:8px;align-items:stretch;background:linear-gradient(160deg,rgba(20,28,48,0.98),rgba(10,10,22,0.98));border:1px solid rgba(0,240,255,0.35);box-shadow:0 0 24px rgba(0,240,255,0.18),inset 0 0 16px rgba(255,45,149,0.08);}
    .bb-card .btn{display:block;width:100%;margin:0;min-height:44px;}
    .bb-card-title{font-family:var(--font-pixel);font-size:15px;color:var(--neon-pink);text-shadow:0 0 12px rgba(255,45,149,0.55);text-align:center;}
    .bb-card-sub{font-size:11px;color:var(--text-dim);line-height:1.7;text-align:center;}
    .game-overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,7,13,0.88);border-radius:var(--radius);text-align:center;}
    .game-overlay[hidden]{display:none;}
    .game-overlay .ov-title{font-family:var(--font-pixel);font-size:17px;color:var(--neon-pink);text-shadow:0 0 12px rgba(255,45,149,0.8);}
    .game-overlay .ov-title.win{color:var(--neon-green);text-shadow:0 0 14px rgba(57,255,20,0.7);}
    .bb-final-score{display:flex;flex-direction:column;align-items:center;gap:1px;}
    .bb-final-score b{font-family:var(--font-pixel);font-size:28px;line-height:1.2;color:var(--neon-yellow);text-shadow:0 0 12px rgba(255,230,0,0.7);}
    .bb-final-score small{font-size:9px;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;}
    .bb-result-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .bb-result-grid div{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);}
    .bb-result-grid span{font-size:9px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;}
    .bb-result-grid b{font-family:var(--font-pixel);font-size:13px;color:var(--neon-cyan);text-shadow:0 0 8px rgba(0,240,255,0.4);}
    .game-overlay .ov-record{font-size:12px;color:var(--neon-green);min-height:16px;line-height:1.4;text-shadow:0 0 8px rgba(57,255,20,0.6);}
    .bb-controls{display:flex;justify-content:center;gap:10px;margin:10px 0 2px;}
    .bb-controls .btn{min-height:44px;min-width:104px;border-radius:10px;font-size:11px;}
    @media (max-width:480px){
      .bb-pick{padding:16px 8px 12px;}
      .bb-pick-t{font-size:15px;}
      .bb-pick-d{font-size:11px;margin:8px auto 14px;}
      .bb-diff-btn{min-height:50px;padding:8px 12px;}
      .bb-stat{padding:4px 2px;}
      .bb-stat b{font-size:11px;}
      .bb-controls .btn{min-width:94px;font-size:10px;padding:9px 12px;}
      .bb-final-score b{font-size:24px;}
      .bb-card{padding:14px 12px;}
    }
  </style>
<style>@media (max-width:900px){ main#game-root{padding-top:32px;} .brickbash-stage{max-width:326px;} .bb-hud{margin:4px 0 3px;} }</style>
