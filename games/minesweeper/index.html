  <style>
    /* ---------- 扫雷 · 旗舰版 ---------- */
    .ms-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; }

    .ms-pick { width: min(640px, 100%); text-align: center; margin: 0 auto 2px; }
    .ms-pick-title {
      font-family: var(--font-pixel); font-size: 9px; letter-spacing: 2px;
      color: var(--text-dim); margin-bottom: 6px;
    }
    .ms-diff-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .ms-diff-btn {
      appearance: none; -webkit-appearance: none;
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 46px; padding: 6px 16px;
      font-family: var(--font-pixel); color: var(--text-dim);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 10px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .ms-diff-btn b { font-weight: 400; font-size: 11px; color: var(--text-main); white-space: nowrap; }
    .ms-diff-btn small {
      font-family: var(--font-body); font-size: 9px; letter-spacing: 0.5px;
      color: var(--text-dim); white-space: nowrap;
    }
    .ms-diff-btn:hover { border-color: rgba(0, 240, 255, 0.7); background: rgba(0, 240, 255, 0.07); }
    .ms-diff-btn:active { transform: scale(0.97); }
    .ms-diff-btn.is-active {
      border-color: var(--neon-cyan);
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.06));
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 10px rgba(0, 240, 255, 0.12);
    }
    .ms-diff-btn.is-active b { color: #eaffff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.8); }
    .ms-diff-btn.is-active small { color: rgba(220, 250, 255, 0.8); }
    .ms-custom-toggle {
      margin-top: 7px; min-height: 34px; padding: 5px 12px;
      font-family: var(--font-pixel); font-size: 9px; color: var(--text-dim);
      background: transparent; border: 1px dashed rgba(185, 103, 255, 0.35);
      border-radius: 8px; cursor: pointer;
    }
    .ms-custom-toggle:hover, .ms-custom-toggle.is-active {
      color: var(--neon-purple); border-color: var(--neon-purple);
      background: rgba(185, 103, 255, 0.1);
    }

    .ms-custom { margin: 8px 0 0; }
    .ms-custom label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-dim);
    }
    .ms-custom input { width: 54px; }

    .ms-hud {
      display: flex; gap: 8px; justify-content: center; align-items: stretch;
      flex-wrap: wrap; width: min(640px, 100%); margin: 12px auto 0;
    }
    .ms-hud-item {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 7px 12px;
      font-size: 11px; line-height: 1.4; color: var(--text-dim);
      background: linear-gradient(180deg, rgba(20, 24, 48, 0.92), rgba(9, 11, 22, 0.92));
      border: 1px solid rgba(0, 240, 255, 0.24);
      border-radius: 10px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .ms-hud-item .stat-value {
      color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 14px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.55);
    }
    .ms-hud-item .stat-value.neg {
      color: var(--neon-pink); text-shadow: 0 0 8px rgba(255, 45, 149, 0.6);
    }
    .ms-best { border-color: rgba(255, 230, 0, 0.36); }
    .ms-best .stat-value {
      color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
    }
    .ms-best.flash { animation: best-flash 0.35s ease 3; }

    .ms-msg { margin: 10px 0 0; min-height: 20px; }
    .ms-stage { position: relative; width: fit-content; max-width: 100%; margin: 8px auto 0; }

    .ms-board {
      margin: 0 auto; gap: 3px; padding: 6px;
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.1), transparent 55%),
        linear-gradient(160deg, rgba(18, 22, 44, 0.98), rgba(7, 9, 18, 0.99));
      border: 1px solid rgba(0, 240, 255, 0.32);
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.12), 0 10px 26px rgba(0, 0, 0, 0.45),
        inset 0 0 28px rgba(0, 0, 0, 0.55);
      touch-action: manipulation;
      outline: none;
    }
    .ms-board:focus-visible {
      box-shadow: 0 0 0 2px var(--neon-yellow), 0 0 24px rgba(0, 240, 255, 0.12);
    }
    .ms-board.d-easy { width: min(420px, calc(100vw - 16px)); }
    .ms-board.d-mid { width: min(560px, calc(100vw - 16px)); gap: 2px; }
    .ms-board.d-hard { width: min(640px, calc(100vw - 16px)); gap: 2px; }

    .ms-cell {
      position: relative; aspect-ratio: 1; min-width: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-pixel); line-height: 1;
      color: var(--text-main);
      background-color: #1a1d38;
      background-image:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 45%),
        linear-gradient(150deg, #30365f 0%, #1b1f3d 52%, #12152a 100%);
      border: 1px solid rgba(110, 160, 255, 0.24);
      border-radius: 5px;
      box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.16),
        inset -1px -1px 2px rgba(0, 0, 0, 0.55), 0 2px 3px rgba(0, 0, 0, 0.35);
      cursor: pointer; overflow: hidden;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      touch-action: manipulation;
      transition: filter 0.12s, transform 0.12s, border-color 0.12s;
    }
    .ms-cell:not(.open):not(.mine):hover {
      filter: brightness(1.25); border-color: rgba(0, 240, 255, 0.5);
    }
    .ms-cell:not(.open):not(.mine):active { transform: translateY(1px) scale(0.97); }
    .ms-board.d-easy .ms-cell { font-size: 16px; }
    .ms-board.d-mid .ms-cell { font-size: 12px; border-radius: 4px; }
    .ms-board.d-hard .ms-cell { font-size: 10px; border-radius: 3px; }

    .ms-cell.open {
      background: linear-gradient(180deg, #0c101e, #080a13);
      border-color: rgba(0, 240, 255, 0.08);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), inset 0 0 6px rgba(0, 0, 0, 0.4);
      cursor: default;
      animation: ms-reveal 0.24s cubic-bezier(0.2, 0.75, 0.3, 1) both;
    }
    @keyframes ms-reveal {
      0%   { transform: scale(0.8); filter: brightness(1.9); opacity: 0.55; }
      60%  { filter: brightness(1.25); }
      100% { transform: scale(1); filter: brightness(1); opacity: 1; }
    }

    .ms-cell.flagged {
      background-image:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.2), transparent 45%),
        linear-gradient(150deg, #4a3a12, #241b08);
      border-color: rgba(255, 230, 0, 0.45);
      animation: ms-flag 0.32s cubic-bezier(0.2, 1.5, 0.5, 1) both;
    }
    @keyframes ms-flag {
      0%   { transform: scale(0.85); }
      55%  { transform: scale(1.12) rotate(-4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .ms-cell.flagged::before {
      content: ''; position: absolute; left: 47%; top: 23%;
      width: 2px; height: 52%;
      background: linear-gradient(180deg, #ffe600, #b58b00);
      box-shadow: 0 0 4px rgba(255, 230, 0, 0.7);
    }
    .ms-cell.flagged::after {
      content: ''; position: absolute; left: 49%; top: 23%;
      width: 32%; height: 28%;
      background: linear-gradient(135deg, #ff6fae, #ff2d95);
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      filter: drop-shadow(0 0 3px rgba(255, 45, 149, 0.7));
    }
    .ms-cell.wrong {
      background: linear-gradient(150deg, #4a1018, #20060a);
      border-color: rgba(255, 45, 149, 0.6);
      color: var(--neon-pink) !important;
      text-shadow: 0 0 6px rgba(255, 45, 149, 0.7) !important;
    }
    .ms-cell.wrong::before, .ms-cell.wrong::after { display: none; }

    .ms-cell.mine {
      background: radial-gradient(circle at 50% 45%, #3a1424, #18080f 70%);
      border-color: rgba(255, 45, 149, 0.35);
      animation: ms-mine-in 0.22s ease both;
    }
    @keyframes ms-mine-in {
      from { transform: scale(0.5); opacity: 0.2; }
      to   { transform: scale(1); opacity: 1; }
    }
    .ms-cell.mine::before {
      content: ''; position: absolute; width: 54%; height: 54%; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffd8e5 0%, #ff5aa0 30%, #c10c5a 65%, #5c0529 100%);
      box-shadow: 0 0 9px rgba(255, 45, 149, 0.85), inset -2px -2px 4px rgba(0, 0, 0, 0.55);
    }
    .ms-cell.mine::after {
      content: ''; position: absolute; left: 38%; top: 32%;
      width: 16%; height: 16%; border-radius: 50%; background: #fff; opacity: 0.65;
      filter: blur(0.5px);
    }
    .ms-cell.boom {
      background: radial-gradient(circle, #ffffff 0%, #ff6fae 25%, #ff2d95 55%, #4a0520 100%);
      border-color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 45, 149, 0.95);
      z-index: 2;
      animation: ms-boom 0.5s ease-out both;
    }
    @keyframes ms-boom {
      0%   { transform: scale(0.7); filter: brightness(2.4); }
      55%  { transform: scale(1.18); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    /* 经典数字配色 + 微光 */
    .ms-cell.n1 { color: #6cb6ff; text-shadow: 0 0 6px rgba(108, 182, 255, 0.75); }
    .ms-cell.n2 { color: #3ddc84; text-shadow: 0 0 6px rgba(61, 220, 132, 0.75); }
    .ms-cell.n3 { color: #ff5c6c; text-shadow: 0 0 6px rgba(255, 92, 108, 0.75); }
    .ms-cell.n4 { color: #a78bfa; text-shadow: 0 0 6px rgba(167, 139, 250, 0.75); }
    .ms-cell.n5 { color: #ffb347; text-shadow: 0 0 6px rgba(255, 179, 71, 0.75); }
    .ms-cell.n6 { color: #2dd4bf; text-shadow: 0 0 6px rgba(45, 212, 191, 0.75); }
    .ms-cell.n7 { color: #e8e8f0; text-shadow: 0 0 6px rgba(232, 232, 240, 0.7); }
    .ms-cell.n8 { color: #9aa3b2; text-shadow: 0 0 6px rgba(154, 163, 178, 0.7); }

    .ms-cell.cursor {
      outline: 2px solid var(--neon-yellow); outline-offset: -2px;
      box-shadow: inset 0 0 0 2px rgba(255, 230, 0, 0.85), 0 0 10px rgba(255, 230, 0, 0.5);
      z-index: 1;
    }
    .ms-cell.win-wave { animation: ms-wave 0.55s ease both; }
    @keyframes ms-wave {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.08); box-shadow: inset 0 0 12px rgba(57, 255, 20, 0.55), 0 0 10px rgba(57, 255, 20, 0.35); }
      100% { transform: scale(1); }
    }

    .ms-result {
      position: absolute; inset: 0; z-index: 10; padding: 10px;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(10, 14, 28, 0.72), rgba(4, 6, 12, 0.92));
      -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
      border-radius: 12px;
    }
    .ms-result-card {
      width: min(330px, 94%); max-height: 100%; overflow: auto;
      padding: 16px 14px 14px; text-align: center; border-radius: 14px;
      background: linear-gradient(160deg, rgba(22, 28, 52, 0.98), rgba(9, 10, 22, 0.98));
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.2), inset 0 0 18px rgba(255, 45, 149, 0.08);
      animation: ms-card-in 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    @keyframes ms-card-in {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .ms-result-title {
      margin-bottom: 6px; font-family: var(--font-pixel); font-size: 16px;
      color: var(--neon-pink); text-shadow: 0 0 12px rgba(255, 45, 149, 0.6);
    }
    .ms-result-title.win {
      color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255, 230, 0, 0.65);
    }
    .ms-result-sub {
      margin-bottom: 10px; font-size: 11px; line-height: 1.7; color: var(--text-dim);
    }
    .ms-result-stats { display: flex; justify-content: center; gap: 18px; margin: 6px 0 8px; }
    .ms-result-stats div {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 10px; color: var(--text-dim);
    }
    .ms-result-stats b { font-family: var(--font-pixel); font-size: 14px; color: var(--neon-cyan); }
    .ms-result-stats div:last-child b { color: var(--neon-yellow); }
    .ms-record {
      margin: 4px 0 8px; font-family: var(--font-pixel); font-size: 10px;
      color: var(--neon-green); text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
      animation: best-flash 0.35s ease 3;
    }
    .ms-result-again { width: 100%; margin-top: 4px; }
    .ms-result-change { margin: 10px 0 6px; font-size: 10px; color: var(--text-dim); }
    .ms-result-diffs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .ms-mini-btn {
      min-height: 38px; padding: 9px 10px;
      font-family: var(--font-pixel); font-size: 9px; color: var(--neon-cyan);
      background: transparent; border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 7px; cursor: pointer;
    }
    .ms-mini-btn:hover { background: rgba(0, 240, 255, 0.14); }

    .ms-controls { margin-top: 12px; }

    @media (max-width: 480px) {
      .ms-pick-title { font-size: 8px; letter-spacing: 1px; }
      .ms-diff-btn { min-height: 42px; padding: 5px 11px; }
      .ms-diff-btn b { font-size: 10px; }
      .ms-diff-btn small { font-size: 8px; }
      .ms-hud { gap: 6px; margin-top: 10px; }
      .ms-hud-item { min-height: 36px; padding: 6px 9px; font-size: 10px; gap: 6px; }
      .ms-hud-item .stat-value { font-size: 12px; }
      .ms-board { padding: 4px; gap: 1px; }
      .ms-board.d-mid, .ms-board.d-hard { gap: 1px; }
      .ms-board.d-easy .ms-cell { font-size: 15px; border-radius: 4px; }
      .ms-board.d-mid .ms-cell { font-size: 10px; border-radius: 3px; }
      .ms-board.d-hard .ms-cell { font-size: 8.5px; border-radius: 2px; }
      .ms-result-card { padding: 12px 10px; }
      .ms-result-title { font-size: 14px; }
      .ms-result-sub { font-size: 10px; }
    }

    /* ---------- 工具条 / 每日 / 成就 / 无猜 ---------- */
    .ms-tools {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
      width: min(640px, 100%); margin: 10px auto 0;
    }
    .ms-tool-btn {
      appearance: none; -webkit-appearance: none;
      display: inline-flex; align-items: center; gap: 7px;
      min-height: 44px; min-width: 44px; padding: 6px 12px;
      font-family: var(--font-pixel); font-size: 9px; letter-spacing: 0.5px;
      color: var(--text-dim); cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 240, 255, 0.22);
      border-radius: 10px;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, color 0.15s;
    }
    .ms-tool-btn:hover { border-color: rgba(0, 240, 255, 0.6); background: rgba(0, 240, 255, 0.07); }
    .ms-tool-btn:active { transform: scale(0.97); }
    .ms-tool-btn .ms-tool-txt { white-space: nowrap; }
    .ms-tool-btn small {
      font-family: var(--font-body); font-size: 9px; letter-spacing: 0;
      color: var(--text-dim); white-space: nowrap;
    }
    .ms-tool-btn.is-on {
      color: var(--neon-cyan); border-color: var(--neon-cyan);
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.18), rgba(0, 240, 255, 0.04));
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.28);
    }
    .ms-tool-btn.is-done { color: var(--neon-green); border-color: rgba(57, 255, 20, 0.5); }
    .ms-tool-btn.is-done small { color: var(--neon-green); }
    .ms-tool-ic {
      position: relative; flex: none; width: 16px; height: 16px; display: inline-block;
    }
    .ms-tool-ic.ic-daily {
      border: 2px solid currentColor; border-radius: 3px; color: inherit;
    }
    .ms-tool-ic.ic-daily::before {
      content: ''; position: absolute; left: 1px; right: 1px; top: 4px; height: 2px;
      background: currentColor; opacity: 0.8;
    }
    .ms-tool-ic.ic-daily::after {
      content: ''; position: absolute; left: 4px; bottom: 3px; width: 3px; height: 3px;
      background: currentColor; box-shadow: 5px 0 0 currentColor;
    }
    .ms-tool-ic.ic-ach {
      background: linear-gradient(160deg, currentColor, rgba(255, 230, 0, 0.35));
      clip-path: polygon(50% 0, 92% 18%, 82% 72%, 50% 100%, 18% 72%, 8% 18%);
      opacity: 0.9;
    }
    .ms-tool-ic.ic-lock {
      border: 2px solid currentColor; border-radius: 4px; height: 10px; margin-top: 5px;
    }
    .ms-tool-ic.ic-lock::before {
      content: ''; position: absolute; left: 3px; top: -8px; width: 6px; height: 8px;
      border: 2px solid currentColor; border-bottom: none; border-radius: 5px 5px 0 0;
    }
    .ms-daily-hud .stat-value { color: var(--text-dim); font-size: 11px; text-shadow: none; }
    .ms-daily-hud .stat-value.done { color: var(--neon-green); text-shadow: 0 0 8px rgba(57, 255, 20, 0.55); }

    .ms-custom-toggle { min-height: 44px; }
    .ms-custom input { min-height: 44px; }
    .ms-custom .btn { min-height: 44px; }

    /* ---------- 可横向滚动的棋盘容器（专家） ---------- */
    .ms-stage {
      position: relative; width: min(640px, 100%); max-width: 100%;
      margin: 8px auto 0; display: flex; justify-content: center; align-items: flex-start;
    }
    .ms-scroll {
      position: relative; width: 100%; max-width: 100%;

      touch-action: pan-x pan-y;

    .ms-result-stats {

    .ms-ach-new {

    .ms-ach-chip {

      background: rgba(255, 230, 0, 0.1); border: 1px solid rgba(255, 230, 0, 0.45);
      white-space: nowrap;
    }

    /* ---------- 成就面板 ---------- */
    .ms-ach-overlay {
      position: fixed; inset: 0; z-index: 9999; padding: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(4, 6, 12, 0.84);

    }
    .ms-ach-panel {
      width: min(430px, 100%); max-height: min(82vh, 580px);
      display: flex; flex-direction: column; overflow: hidden;
      background: linear-gradient(160deg, rgba(22, 28, 52, 0.99), rgba(8, 10, 20, 0.99));
      border: 1px solid rgba(255, 230, 0, 0.4);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(255, 230, 0, 0.16), 0 18px 44px rgba(0, 0, 0, 0.6);
      animation: ms-card-in 0.25s ease both;
    }
    .ms-ach-head {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 230, 0, 0.2); flex: none;
    }
    .ms-ach-title {
      font-family: var(--font-pixel); font-size: 12px; color: var(--neon-yellow);
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
    }
    .ms-ach-prog { font-size: 11px; color: var(--text-dim); margin-left: auto; }
    .ms-ach-close {
      min-width: 64px; min-height: 44px; padding: 6px 12px;
      font-family: var(--font-pixel); font-size: 9px; color: var(--neon-cyan);
      background: transparent; border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 9px; cursor: pointer;
    }
    .ms-ach-close:hover { background: rgba(0, 240, 255, 0.12); }
    .ms-ach-list { padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .ms-ach-item {
      display: flex; align-items: center; gap: 10px; min-height: 48px;
      padding: 8px 10px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.025); border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ms-ach-item.got { border-color: rgba(255, 230, 0, 0.4); background: rgba(255, 230, 0, 0.06); }
    .ms-ach-ico {
      position: relative; flex: none; width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.16); opacity: 0.55;
    }

      border-color: var(--neon-yellow); opacity: 1;
      background: radial-gradient(circle, rgba(255, 230, 0, 0.22), transparent 70%);
    }
    .ms-ach-item.got .ms-ach-ico::after {
      content: ''; position: absolute; left: 8px; top: 5px; width: 10px; height: 6px;
      border-left: 3px solid var(--neon-yellow); border-bottom: 3px solid var(--neon-yellow);
      transform: rotate(-40deg); filter: drop-shadow(0 0 5px rgba(255, 230, 0, 0.8));

    .ms-ach-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
