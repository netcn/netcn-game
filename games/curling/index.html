  <style>
    .crl-hud {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      width: min(360px, calc(100vw - 20px)); margin: 4px auto 0; padding: 7px 10px;
      font-size: 10px; color: var(--text-dim); border-radius: 10px;
      background: linear-gradient(90deg, rgba(255,45,149,0.10), rgba(0,240,255,0.08));
      border: 1px solid rgba(0,240,255,0.25);
      font-family: var(--font-pixel); letter-spacing: 0.5px;
    }
    .crl-cell { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
    .crl-k { font-size: 9px; color: var(--text-dim); }
    .crl-k.me { color: var(--neon-pink); }
    .crl-k.ai { color: var(--neon-cyan); }
    .crl-hud b { color: #fff; font-size: 13px; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
    #crl-curl { min-width: 48px; min-height: 44px; }
    .crl-hud .crl-score b#crl-mine { color: var(--neon-pink); }
    .crl-hud .crl-score b#crl-their { color: var(--neon-cyan); }
    .crl-colon { color: var(--text-dim); }
    .crl-hud #crl-best { color: var(--neon-yellow); }
    .crl-stage {
      position: relative; width: min(360px, calc(100vw - 20px)); margin: 6px auto;
      filter: drop-shadow(0 0 16px rgba(80,200,255,0.16));
    }
    .crl-canvas {
      width: 100%; height: auto; border-radius: 12px; display: block;
      border: 1px solid rgba(120,220,255,0.45); background: #0b2637;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 24px rgba(0,200,255,0.12);
      touch-action: none; max-width: 100%; cursor: crosshair;
    }
    .crl-msg {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 88%; text-align: center;
      padding: 4px 12px; border-radius: 999px; pointer-events: none;
      font-family: var(--font-pixel); font-size: 11px; color: var(--neon-yellow);
      background: rgba(6,16,24,0.78); border: 1px solid rgba(255,230,0,0.35);
      text-shadow: 0 0 10px rgba(255,230,0,0.5);
      transition: opacity .2s;
    }
    .crl-msg:empty { display: none; }
    .crl-overlay {
      position: absolute; inset: 0; z-index: 6; display: none;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(12,36,52,0.90), rgba(4,10,16,0.96));
      border-radius: 12px; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    }
    .crl-overlay.show { display: flex; }
    .crl-card {
      width: min(292px, 90%); padding: 18px 16px; text-align: center;
      border-radius: 14px; border: 1px solid rgba(0,240,255,0.4);
      background: linear-gradient(160deg, rgba(14,40,58,0.98), rgba(6,14,24,0.98));
      box-shadow: 0 0 30px rgba(0,200,255,0.22);
    }
    .crl-ov-title {
      font-family: var(--font-pixel); font-size: 16px; color: var(--neon-yellow);
      text-shadow: 0 0 12px rgba(255,230,0,0.55); margin-bottom: 8px;
    }
    .crl-card.win .crl-ov-title { color: var(--neon-green); text-shadow: 0 0 12px rgba(57,255,20,0.6); }
    .crl-card.lose .crl-ov-title { color: var(--neon-pink); text-shadow: 0 0 12px rgba(255,45,149,0.6); }
    .crl-ov-sub { font-size: 12px; color: var(--text-main); line-height: 1.8; }
    .crl-ov-stats { font-size: 11px; color: var(--text-dim); line-height: 1.9; margin: 10px 0 14px; }
    .crl-ov-stats b { color: var(--neon-yellow); font-family: var(--font-pixel); }
    .crl-newbest { color: var(--neon-green); text-shadow: 0 0 8px rgba(57,255,20,0.5); }
    .crl-card .btn { width: 100%; }
    .crl-status {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: min(360px, calc(100vw - 20px)); margin: 0 auto; padding: 4px 2px;
      font-size: 11px; color: var(--text-dim); flex-wrap: wrap;
    }
    .crl-status b { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 11px; }
    .crl-meters { color: var(--text-dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .crl-meters b { color: var(--neon-yellow); }
    .crl-dot { color: var(--text-dim); }
    .crl-ice-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--text-dim); }
    #crl-ice { color: var(--neon-purple); }
    .crl-formats { margin-top: 2px; }
    /* 自绘图标（不使用 emoji 皮肤） */
    .crl-ic { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; margin-right: 3px; flex: none; }
    .crl-ic-rock { border-radius: 50%; background: radial-gradient(circle at 36% 32%, #f4f7fb, #9aa7b4 46%, #4b5866 72%, #232c36); box-shadow: 0 0 6px rgba(180,220,240,.55); }
    .crl-ic-broom { border-radius: 2px; background: repeating-linear-gradient(90deg, #ffe600 0 2px, #ff9f1c 2px 4px); transform: rotate(-32deg); box-shadow: 0 0 6px rgba(255,200,0,.5); }
    .crl-ic-spin { border-radius: 50%; background: conic-gradient(from 20deg, #b967ff, #ff2d95 40%, #00f0ff 70%, rgba(0,240,255,0)); box-shadow: 0 0 7px rgba(185,103,255,.6); }
    .crl-ic-spin:after { content: ''; display: block; width: 100%; height: 100%; border-radius: 50%; background: #0a0a12; transform: scale(.62); }
    .crl-ic-target { border-radius: 50%; background: radial-gradient(circle, #ffe600 0 18%, #0a0a12 18% 32%, #ff2d95 32% 55%, #0a0a12 55% 72%, #00f0ff 72%); box-shadow: 0 0 6px rgba(0,240,255,.5); }
    .crl-ic-volt { background: linear-gradient(160deg, #fff8b0, #ffe600 55%, #ff9f1c); clip-path: polygon(56% 0, 20% 54%, 46% 54%, 36% 100%, 82% 40%, 54% 40%); filter: drop-shadow(0 0 4px rgba(255,230,0,.8)); }
    .crl-ic-ice { background: linear-gradient(150deg, #d6fbff, #00f0ff 55%, #0b6a7a); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 4px rgba(0,240,255,.7)); }
    .crl-controls .btn.left .crl-ic-spin { transform: scaleX(-1); }
    #crl-diffs .mode-btn, .crl-formats .mode-btn { min-height: 44px; }
    .mode-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .crl-controls {
      width: min(360px, calc(100vw - 20px)); margin: 2px auto 0;
    }
    .crl-controls .game-controls { margin: 4px 0; gap: 7px; }
    .crl-controls .btn {
      font-size: 10px; padding: 0 11px; min-height: 44px; line-height: 42px; border-radius: 8px;
    }
    .crl-controls .btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
    .crl-controls .btn:disabled:hover { background: transparent; color: inherit; }
    .crl-ends {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      width: min(360px, calc(100vw - 20px)); margin: 4px auto 0;
    }
    .crl-endbox {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 3px 4px; border-radius: 7px; font-size: 10px;
      border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.035);
      color: var(--text-dim); font-family: var(--font-pixel);
    }
    .crl-endbox i { font-style: normal; font-size: 8px; color: var(--text-dim); }
    .crl-endbox b { color: var(--neon-pink); font-size: 11px; }
    .crl-endbox span { color: var(--neon-cyan); font-size: 11px; }
    .crl-endbox.active { border-color: rgba(255,230,0,0.55); background: rgba(255,230,0,0.08); }
    .crl-endbox.done { border-color: rgba(0,240,255,0.28); }
    .crl-help {
      width: min(360px, calc(100vw - 20px)); margin: 4px auto 0; padding: 6px 10px;
      font-size: 11px; line-height: 1.55; color: var(--text-dim); text-align: left;
      background: rgba(255,255,255,0.04); border-radius: 8px;
    }
    @media (max-width: 480px) {
      .crl-hud { padding: 6px 8px; }
      .crl-controls .btn { font-size: 9px; padding: 0 9px; }
    }
  </style>
<style>@media (max-width:900px){ main#game-root{padding-top:32px;} .crl-stage{margin:3px auto;} .crl-help{display:none;} }</style>
