  <style>
    .dn-wrap { position: relative; padding: 14px; width: min(640px, 96vw); margin: 0 auto; text-align: center; }
    .dn-stage { position: relative; width: 100%; max-width: 640px; margin: 0 auto;
      filter: drop-shadow(0 0 16px rgba(57,255,20,0.14)); }
    .dn-canvas { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--nc-stage-2);
      border: 1px solid rgba(57,255,20,0.28); touch-action: none; }
    .dn-top { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 3px 10px;
      font-size: 12px; color: var(--text-dim); margin: 0 0 8px; padding: 7px 10px; border-radius: 8px;
      background: linear-gradient(90deg, rgba(57,255,20,0.08), rgba(0,240,255,0.05));
      border: 1px solid rgba(57,255,20,0.22); }
    .dn-top span { white-space: nowrap; }
    .dn-top b { color: var(--neon-yellow); font-family: 'Consolas', 'Courier New', monospace; }
    .dn-weather { color: var(--neon-cyan); }
    .dn-weather b { color: var(--neon-cyan); }

    /* 自绘图标（纯 CSS，不用 emoji 当美术） */
    .dn-ico { display: inline-block; position: relative; width: 14px; height: 14px; flex: none; vertical-align: -2px; }
    .dn-ico-coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff9c4, #ffe600 48%, #c58f00 100%);
      box-shadow: 0 0 6px rgba(255,230,0,0.65), inset 0 0 0 1px rgba(110,74,0,0.55); }
    .dn-ico-coin::after { content: ''; position: absolute; left: 6px; top: 3px; width: 2px; height: 5px;
      background: var(--nc-stage-2); border-radius: 1px; }
    .dn-ico-magnet::before { content: ''; position: absolute; inset: 1px 1px 2px; border: 3px solid #ff2d95;
      border-top: 0; border-radius: 0 0 7px 7px; box-shadow: 0 0 6px rgba(255,45,149,0.55); }
    .dn-ico-magnet::after { content: ''; position: absolute; left: 0; right: 0; top: 1px; height: 4px;
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2)); border-radius: 2px; }
    .dn-ico-shield::before { content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      clip-path: polygon(50% 0, 96% 20%, 96% 56%, 50% 100%, 4% 56%, 4% 20%);
      box-shadow: var(--ui-shadow); }
    .dn-ico-shield::after { content: ''; position: absolute; left: 6px; top: 4px; width: 2px; height: 6px;
      background: var(--nc-stage-2); border-radius: 1px; }
    .dn-ico-slow::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid #b967ff; background: rgba(185,103,255,0.16); box-shadow: 0 0 6px rgba(185,103,255,0.7); }
    .dn-ico-slow::after { content: ''; position: absolute; left: 6px; top: 3px; width: 2px; height: 5px;
      background: #ddc0ff; transform-origin: 50% 100%; transform: rotate(28deg);
      box-shadow: 2px 4px 0 -1px #ddc0ff; }
    .dn-ico-w-sunny { border-radius: 50%; background: radial-gradient(circle, #fff8c0, #ffd400 72%);
      box-shadow: 0 0 6px rgba(255,212,0,0.7), 0 -5px 0 -3px #ffd400, 0 5px 0 -3px #ffd400, -5px 0 0 -3px #ffd400, 5px 0 0 -3px #ffd400; }
    .dn-ico-w-rain { background: repeating-linear-gradient(90deg, #6fd0ff 0 2px, transparent 2px 5px);
      background-size: 5px 14px; border-radius: 2px; box-shadow: 0 0 5px rgba(111,208,255,0.5); }
    .dn-ico-w-sand { background: repeating-linear-gradient(160deg, #e0a75c 0 2px, transparent 2px 5px);
      border-radius: 3px; box-shadow: 0 0 5px rgba(224,167,92,0.5); }
    .dn-ico-w-night { border-radius: 50%; background: #dce8ff;
      box-shadow: inset 5px -2px 0 0 #0a0a12, 0 0 6px rgba(200,225,255,0.6); }

    .dn-msg { min-height: 18px; font-size: 12px; color: var(--neon-green); margin: 8px 0; line-height: 1.6; }

    /* 道具 HUD */
    .dn-power { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 8px 2px 0; flex-wrap: wrap; }
    .dn-pw { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 8px;
      border: 1px solid rgba(24,32,52,0.12); background: rgba(24,32,52,0.03);
      opacity: 0.32; transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s; }
    .dn-pw.on { opacity: 1; }
    .dn-pw[data-pw="magnet"].on { border-color: #ff2d95; box-shadow: 0 0 8px rgba(255,45,149,0.3) inset; }
    .dn-pw[data-pw="shield"].on { border-color: #00f0ff; box-shadow: var(--ui-shadow); }
    .dn-pw[data-pw="slow"].on { border-color: #b967ff; box-shadow: 0 0 8px rgba(185,103,255,0.3) inset; }
    .dn-pw i { display: block; width: 24px; height: 3px; border-radius: 2px; background: rgba(24,32,52,0.16); overflow: hidden; }
    .dn-pw i em { display: block; height: 100%; width: 0; background: currentColor; }
    .dn-pw[data-pw="magnet"] { color: #ff2d95; }
    .dn-pw[data-pw="shield"] { color: #00f0ff; }
    .dn-pw[data-pw="slow"] { color: #b967ff; }

    /* Boss 血条 / 追逐进度 */
    .dn-boss { margin: 8px 2px 0; padding: 6px 8px; border-radius: 8px; text-align: left;
      background: var(--nc-stage-2); border: 1px solid rgba(255,45,149,0.45);
      box-shadow: 0 0 14px rgba(255,45,149,0.18) inset; }
    .dn-boss-top { display: flex; justify-content: space-between; align-items: center; font-size: 10px;
      letter-spacing: 1px; color: var(--neon-pink); margin-bottom: 4px; }
    .dn-boss-top b { color: var(--neon-yellow); font-family: 'Consolas', 'Courier New', monospace; }
    .dn-boss-bar { height: 6px; border-radius: 999px; background: rgba(24,32,52,0.1); overflow: hidden; }
    .dn-boss-bar + .dn-boss-bar { margin-top: 3px; height: 3px; }
    .dn-boss-bar i { display: block; height: 100%; width: 100%; }
    .dn-boss-hp i { background: linear-gradient(90deg, #ff2d95, #ff9f1c); transition: width 0.16s ease-out; }
    .dn-boss-chase i { background: linear-gradient(90deg, rgba(255,230,0,0.55), #ffe600); transition: width 0.12s linear; }

    /* 任务面板 */
    .dn-tasks { display: flex; flex-direction: column; gap: 4px; margin: 8px 2px 0; text-align: left; }
    .dn-tasks.idle { display: none; }
    .dn-task { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1px 8px;
      padding: 4px 7px; border-radius: 6px; font-size: 11px; color: var(--text-dim);
      background: rgba(24,32,52,0.03); border: 1px solid rgba(0,240,255,0.12); }
    .dn-task-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dn-task-val { color: var(--neon-cyan); font-family: 'Consolas', 'Courier New', monospace; }
    .dn-task-bar { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: rgba(24,32,52,0.1); overflow: hidden; }
    .dn-task-bar i { display: block; height: 100%; width: 0; border-radius: 999px;
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2)); transition: width 0.18s ease-out; }
    .dn-task.done { border-color: rgba(57,255,20,0.5); color: var(--neon-green); }
    .dn-task.done .dn-task-val { color: var(--neon-green); }
    .dn-task.done .dn-task-bar i { background: var(--neon-green); }

    .dn-over { position: absolute; inset: 0; z-index: 6; display: flex; align-items: flex-start; justify-content: center;
      padding: 10px; overflow-y: auto; overscroll-behavior: contain;
      background: var(--nc-stage-2); border-radius: 12px;
      -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
    .dn-card { margin: auto; width: min(360px, 92%); padding: 16px 14px; border-radius: 14px; text-align: center;
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      border: 1px solid rgba(57,255,20,0.32);
      box-shadow: var(--ui-shadow); }
    .dn-title { font-family: var(--font-pixel); font-size: 15px; color: var(--neon-green);
      text-shadow: 0 0 12px rgba(57,255,20,0.55); margin-bottom: 8px; }
    .dn-hint { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin-bottom: 8px; }
    .dn-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; font-size: 12px;
      color: var(--text-dim); margin: 4px 0; }
    .dn-stats span { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .dn-stats b { color: var(--neon-yellow); font-family: 'Consolas', 'Courier New', monospace; }
    .dn-ov-tasks { margin: 6px 0 2px; }
    .dn-ov-lbl { font-size: 10px; letter-spacing: 1px; color: var(--text-dim); text-align: left; margin: 6px 2px 4px; }
    .dn-diff { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .dn-diff-lbl { font-size: 11px; color: var(--text-dim); width: 100%; }
    .dn-diff .mode-btn { padding: 8px 12px; font-size: 11px; min-height: 44px; min-width: 44px; }
    .dn-diff .mode-btn.selected { border-color: var(--neon-yellow); color: var(--neon-yellow);
      box-shadow: 0 0 10px rgba(255,230,0,0.25) inset; }
    .dn-card > .btn { display: block; width: 100%; margin-top: 8px; min-height: 44px; }
    .dn-touch { display: none; gap: 12px; justify-content: center; margin: 10px 0 4px; }
    .dn-touch.show { display: flex; }
    .dn-touch .btn { min-width: 110px; min-height: 44px; padding: 12px 10px; font-size: 13px; }
    @media (max-width: 480px) {
      .dn-top { font-size: 11px; padding: 6px 8px; gap: 3px 9px; }
      .dn-touch { display: flex; }
      .dn-card { padding: 14px 10px; }
    }
    @media (max-width: 360px) {
      .dn-wrap { padding: 10px; width: 97vw; }
      .dn-top { font-size: 10px; gap: 3px 7px; }
      .dn-card { padding: 12px 9px; }
      .dn-title { font-size: 13px; }
      .dn-hint { font-size: 11px; }
      .dn-stats { font-size: 11px; }
      .dn-ov-lbl { margin-top: 4px; }
      .dn-touch .btn { min-width: 92px; }
      .dn-task { font-size: 10px; padding: 3px 6px; }
      .dn-diff { gap: 4px; margin: 8px 0; }
    }
  </style>
