  <style>
    .td-wrap { padding: 12px 10px 24px; width: min(720px, 96vw); margin: 0 auto; text-align: center; }
    .td-wrap .game-controls.is-hidden { display: none; }
    .td-canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #0a120a;
      border: 1px solid rgba(57,255,20,0.3); box-shadow: 0 0 18px rgba(57,255,20,0.15);
      touch-action: none; max-width: 100%; }
    .td-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; font-size: 12px;
      color: var(--text-dim); margin: 8px 2px; padding: 8px 10px; border-radius: 8px;
      background: linear-gradient(90deg, rgba(57,255,20,0.07), rgba(0,240,255,0.05));
      border: 1px solid rgba(57,255,20,0.2); }
    .td-top b { color: var(--neon-yellow); font-family: var(--font-mono); }
    .td-tray { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
    .td-tower { display: inline-flex; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 7px 10px; cursor: pointer; background: rgba(255,255,255,0.04);
      font-size: 12px; color: var(--text-dim); transition: all 0.15s; }
    .td-tower:hover { border-color: rgba(255,255,255,0.45); }
    .td-tower.sel { border-color: var(--neon-yellow); color: var(--neon-yellow);
      background: rgba(255,230,0,0.08); box-shadow: 0 0 10px rgba(255,230,0,0.28); }
    .td-tower b { color: var(--neon-green); font-family: var(--font-mono); }
    .td-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
    .td-stage { position: relative; width: 100%; max-width: 720px; margin: 8px auto; }
    .td-wave-banner {
      position: absolute; left: 50%; top: 16%; transform: translate(-50%, 10px) scale(.86);
      z-index: 5; pointer-events: none; opacity: 0; white-space: nowrap;
      font-family: var(--font-pixel); font-size: 14px; color: var(--neon-yellow);
      text-shadow: 0 0 12px currentColor, 0 0 26px currentColor;
      padding: 9px 16px; border-radius: 12px; text-align: center;
      background: rgba(6,10,8,.86); border: 1px solid currentColor;
      box-shadow: 0 0 24px currentColor;
      transition: opacity .3s ease, transform .3s cubic-bezier(.2,1.5,.4,1);
    }
    .td-wave-banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .td-wave-banner small { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--neon-cyan); margin-top: 4px; letter-spacing: .1em; }
    .td-over { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
      background: rgba(6,8,16,0.87); border-radius: 10px;
      -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
    .td-card { width: min(360px, 92%); padding: 16px 14px; border-radius: 14px; text-align: center;
      background: linear-gradient(160deg, rgba(16,28,22,0.98), rgba(8,10,18,0.98));
      border: 1px solid rgba(57,255,20,0.32);
      box-shadow: 0 0 26px rgba(57,255,20,0.16), inset 0 0 18px rgba(0,240,255,0.06); }
    .td-title { font-family: var(--font-pixel); font-size: 15px; color: var(--neon-green);
      text-shadow: 0 0 12px rgba(57,255,20,0.55); margin-bottom: 8px; }
    .td-title.win { color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255,230,0,0.6); }
    .td-title.lose { color: var(--neon-pink); text-shadow: 0 0 12px rgba(255,45,149,0.6); }
    .td-hint { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin-bottom: 8px; }
    .td-res-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px;
      color: var(--text-dim); margin: 6px 0 8px; }
    .td-res-stats b { color: var(--neon-yellow); font-family: var(--font-mono); }
    .td-card .btn { display: block; width: 100%; margin-top: 8px; }
    .td-msg { min-height: 18px; font-size: 12px; color: var(--neon-green); margin: 8px 0; line-height: 1.6; }
    .td-sel { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
      margin: 8px 0; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12); }
    .td-sel span { font-size: 12px; color: var(--neon-yellow); }
    .td-sel .btn { padding: 7px 10px; font-size: 12px; }
    #td-speed.on { border-color: var(--neon-yellow); color: var(--neon-yellow);
      box-shadow: 0 0 10px rgba(255,230,0,0.3); }
    @media (max-width: 480px) {
      .td-wrap { padding: 10px 6px 20px; }
      .td-top { font-size: 11px; gap: 4px 8px; padding: 7px 8px; }
      .td-tower { font-size: 11px; padding: 6px 8px; gap: 4px; }
      .td-dot { width: 7px; height: 7px; }
      .td-card { padding: 14px 10px; }
      .td-sel .btn { font-size: 11px; padding: 6px 8px; }
    }
