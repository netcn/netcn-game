  <style>
    .blocks-wrap { position: relative; width: min(360px, 96vw); margin: 0 auto; }
    .blocks-tabs { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
    .blocks-tab {
      flex: 1 1 0; min-height: 44px; min-width: 0; padding: 6px 4px;
      font-family: var(--font-pixel); font-size: 10px; line-height: 1.5;
      color: var(--text-dim); background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
      cursor: pointer; touch-action: manipulation;
    }
    .blocks-tab.active {
      color: var(--neon-cyan); border-color: var(--neon-cyan);
      background: rgba(0,240,255,.10); box-shadow: 0 0 12px rgba(0,240,255,.28);
    }
    .blocks-hud {
      display: flex; gap: 4px; justify-content: space-between;
      font-size: 11px; color: var(--text-dim); margin: 2px 0 4px;
    }
    .blocks-hud span { white-space: nowrap; }
    .blocks-hud b { font-family: var(--font-pixel); font-size: 12px; color: var(--neon-cyan); text-shadow: 0 0 6px rgba(0,240,255,.5); }
    .blocks-obj {
      font-size: 11px; color: var(--neon-yellow); text-align: center;
      min-height: 16px; line-height: 1.5; margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .blocks-layout { display: flex; gap: 6px; justify-content: center; align-items: flex-start; }
    .blocks-stage { width: min(198px, 52.5vw); min-width: 0; }
    .blocks-board {
      display: block; width: 100%; height: auto; aspect-ratio: 1 / 2;
      background: #07070d; border: 1px solid rgba(0,240,255,.3);
      border-radius: 8px; box-shadow: 0 0 18px rgba(0,240,255,.12);
      touch-action: none;
    }
    .blocks-vs { display: none; width: 70px; flex-direction: column; align-items: center; gap: 2px; }
    .blocks-layout.vs .blocks-vs { display: flex; }
    .blocks-vs canvas {
      display: block; width: 100%; height: auto; aspect-ratio: 1 / 2;
      background: #07070d; border: 1px solid rgba(255,45,149,.35);
      border-radius: 6px; box-shadow: 0 0 14px rgba(255,45,149,.16);
    }
    .blocks-side { width: 58px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .blocks-side canvas {
      display: block; width: 100%; height: auto; background: #07070d;
      border: 1px solid rgba(185,103,255,.4); border-radius: 6px;
      box-shadow: 0 0 12px rgba(185,103,255,.14);
    }
    .blocks-next-label {
      font-family: var(--font-pixel); font-size: 8px; color: var(--neon-purple);
      text-shadow: 0 0 6px rgba(185,103,255,.6);
    }
    .blocks-vs-label { font-family: var(--font-pixel); font-size: 8px; color: var(--neon-pink); }
    .blocks-ai-lines { font-size: 9px; color: var(--text-dim); }
    .blocks-banner {
      position: absolute; left: 50%; top: 30%; z-index: 4; pointer-events: none;
      transform: translate(-50%, 8px) scale(.82); opacity: 0;
      font-family: var(--font-pixel); font-size: 12px; white-space: nowrap;
      color: var(--neon-yellow); text-shadow: 0 0 10px currentColor, 0 0 22px currentColor;
      padding: 7px 11px; border-radius: 999px;
      background: rgba(7,7,13,.86); border: 1px solid currentColor;
      box-shadow: 0 0 18px currentColor;
      transition: transform .3s cubic-bezier(.2,1.5,.4,1), opacity .25s ease;
    }
    .blocks-banner.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
    .blocks-quick { display: flex; gap: 8px; justify-content: center; margin: 6px 0; }
    .blocks-quick .btn { min-height: 44px; min-width: 96px; font-size: 10px; }
    .blocks-touch {
      display: none; grid-template-columns: 1fr 1fr; gap: 7px;
      max-width: 340px; margin: 0 auto;
    }
    .blocks-touch .btn {
      width: 100%; min-height: 46px; font-size: 13px; padding: 6px 0;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .blocks-touch .btn:active, .blocks-touch .btn.held {
      background: currentColor; color: #05050c; box-shadow: 0 0 16px currentColor;
      transform: scale(.97);
    }
    .blocks-screen {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 10px; box-sizing: border-box; overflow-y: auto;
      background: linear-gradient(160deg, rgba(5,5,14,.96), rgba(22,6,30,.94));
      border: 1px solid rgba(0,240,255,.24); border-radius: 12px;
      text-align: center;
    }
    .blocks-screen.hidden { display: none; }
    .blocks-screen-title {
      font-family: var(--font-pixel); font-size: 15px; line-height: 1.5;
      color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,45,149,.6);
    }
    .blocks-screen-sub { font-size: 11px; line-height: 1.6; color: var(--text-dim); max-width: 300px; }
    .blocks-screen-stats { font-size: 11px; line-height: 1.8; color: var(--text-dim); }
    .blocks-screen-stats b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 11px; }
    .blocks-btnrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .blocks-btnrow .btn { min-height: 44px; min-width: 104px; font-size: 10px; }
    .blocks-levels { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-height: 300px; overflow-y: auto; }
    .blocks-lv {
      min-height: 52px; padding: 5px 4px; border-radius: 8px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.14);
      color: var(--text-dim); font-family: inherit; font-size: 9px; line-height: 1.5;
      cursor: pointer; touch-action: manipulation;
    }
    .blocks-lv b { display: block; font-family: var(--font-pixel); font-size: 9px; color: var(--neon-cyan); margin-bottom: 2px; }
    .blocks-lv.done { border-color: rgba(57,255,20,.55); background: rgba(57,255,20,.08); }
    .blocks-lv.done b { color: var(--neon-green); }
    .blocks-lv.locked { opacity: .42; }
    @media (max-width: 350px) {
      .blocks-stage { width: 48vw; }
      .blocks-vs { width: 64px; }
      .blocks-side { width: 54px; }
    }
  </style>
