  <style>
    .ch-wrap { padding: 14px 10px 24px; width: min(560px, 96vw); text-align: center; }
    #ch-mode .mode-btn, #ch-diff .mode-btn, #ch-time .mode-btn, #ch-puzzles .mode-btn { min-height: 44px; }
    #ch-diff { margin-bottom: 6px; }
    #ch-diff .mode-btn, #ch-time .mode-btn { padding: 8px 10px; font-size: 11px; }
    .ch-time-row { margin-top: -2px; }
    .ch-time-row .mode-btn { min-width: 62px; }
    .ch-clocks { display: flex; gap: 8px; width: min(440px, 92vw); margin: 0 auto 8px; }
    .ch-clock { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 6px 10px; border-radius: 9px; border: 1px solid rgba(0,240,255,.2);
      background: rgba(0,240,255,.05); transition: border-color .18s, box-shadow .18s; }
    .ch-clock i { font-style: normal; font-size: 10px; color: var(--text-dim); letter-spacing: .06em; }
    .ch-clock b { font-family: var(--font-pixel); font-size: 13px; color: var(--neon-cyan); }
    .ch-clock.active { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0,240,255,.28); }
    .ch-clock.active b { color: #fff; }
    .ch-clock b.low { color: #ff3b6b; text-shadow: 0 0 10px rgba(255,59,107,.7); animation: chLow 1s ease-in-out infinite; }
    @keyframes chLow { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    .ch-ov-note { margin: 4px 0 8px; font-size: 12px; color: var(--neon-yellow); }
    .ch-hud { display: flex; justify-content: space-around; width: min(440px, 92vw); margin: 0 auto 10px;
      background: linear-gradient(90deg, rgba(0,240,255,.07), rgba(255,45,149,.05));
      border: 1px solid rgba(0,240,255,.25); border-radius: 12px; padding: 8px 6px; }
    .ch-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .ch-stat span { font-size: 10px; color: var(--text-dim); letter-spacing: .08em; }
    .ch-stat b { font-family: var(--font-pixel); font-size: 13px; color: var(--neon-cyan); white-space: nowrap; overflow: hidden; max-width: 40vw; }
    .ch-stat:nth-child(2) b { color: var(--neon-yellow); }
    .ch-stat:nth-child(3) b { color: var(--neon-pink); font-size: 15px; }
    .ch-grid { display: grid; grid-template-columns: repeat(8, 1fr); width: min(480px, 92vw); margin: 0 auto;
      border-radius: 10px; overflow: hidden; padding: 5px;
      background: linear-gradient(150deg, #2b2119, #100b07);
      box-shadow: 0 8px 30px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.07); }
    .ch-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative;
      cursor: pointer; user-select: none; overflow: hidden; }
    .ch-cell.light { background: linear-gradient(145deg, #f2e6ca, #d9c49c); }
    .ch-cell.dark { background: linear-gradient(145deg, #7a5c3c, #4f3823); }
    .ch-piece { font-size: clamp(19px, 5.6vw, 33px); line-height: 1; pointer-events: none; }
    .ch-piece.white { color: #fffaf0; -webkit-text-stroke: 1px rgba(60,40,10,.55); text-shadow: 0 2px 3px rgba(0,0,0,.5), 0 0 10px rgba(255,246,220,.35); }
    .ch-piece.black { color: #1d1a24; -webkit-text-stroke: 1px rgba(255,255,255,.35); text-shadow: 0 2px 3px rgba(0,0,0,.45), 0 0 10px rgba(120,140,255,.28); }
    .ch-piece.king { filter: drop-shadow(0 0 6px rgba(255,230,0,.55)); }
    .ch-cell.last::before { content: ''; position: absolute; inset: 0; background: rgba(0,240,255,.16); box-shadow: inset 0 0 0 2px rgba(0,240,255,.5); }
    .ch-cell.sel { box-shadow: inset 0 0 0 3px var(--neon-yellow), 0 0 16px rgba(255,230,0,.55); z-index: 2; }
    .ch-cell.move::after { content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%;
      background: radial-gradient(circle, rgba(57,255,20,.95), rgba(57,255,20,.3));
      box-shadow: 0 0 12px rgba(57,255,20,.7); animation: chDot 1.2s ease-in-out infinite; }
    .ch-cell.capture::after { content: ''; position: absolute; inset: 8%; border-radius: 50%;
      border: 3px solid rgba(255,45,149,.9); box-shadow: 0 0 12px rgba(255,45,149,.6);
      box-sizing: border-box; animation: chRing 1.1s ease-in-out infinite; }
    .ch-cell.promo::after { content: ''; position: absolute; width: 34%; height: 34%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,230,0,.95), rgba(255,230,0,.25));
      box-shadow: 0 0 14px rgba(255,230,0,.8); animation: chDot 1.2s ease-in-out infinite; }
    @keyframes chDot { 0%,100% { transform: scale(.8); opacity: .75; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes chRing { 0%,100% { transform: scale(.94); } 50% { transform: scale(1.05); } }
    .ch-cell.cursor { outline: 2px dashed rgba(0,240,255,.85); outline-offset: -2px; z-index: 3; }
    .ch-cell.check::before { content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle, rgba(255,30,60,.75), rgba(255,30,60,.1) 72%);
      animation: chCheck 1s ease-in-out infinite; }
    @keyframes chCheck { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .ch-msg { min-height: 18px; font-size: 13px; color: var(--neon-green); margin: 10px 0 8px; }
    .ch-help { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin-top: 8px; text-align: left;
      background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 12px; }
    .ch-overlay, .ch-promo { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: radial-gradient(circle at 50% 40%, rgba(10,16,32,.88), rgba(3,4,10,.97));
      animation: chFade .26s ease-out; }
    @keyframes chFade { from { opacity: 0; } to { opacity: 1; } }
    .ch-ov-card { width: min(400px, 92vw); text-align: center; padding: 22px 18px; border-radius: 16px;
      border: 1px solid rgba(0,240,255,.35); background: linear-gradient(160deg, rgba(18,26,48,.98), rgba(8,11,22,.98));
      box-shadow: 0 0 34px rgba(0,240,255,.2), inset 0 1px 0 rgba(255,255,255,.07);
      animation: chCard .3s cubic-bezier(.2,.9,.3,1.25); }
    @keyframes chCard { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
    .ch-ov-icon { font-size: 34px; line-height: 1; margin-bottom: 8px; animation: chPop .42s cubic-bezier(.2,.9,.3,1.5); }
    @keyframes chPop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
    #ch-ov-title { margin: 0 0 8px; font-family: var(--font-pixel); font-size: clamp(14px, 4.4vw, 19px);
      letter-spacing: 1px; color: var(--neon-pink); text-shadow: 0 0 14px rgba(255,45,149,.6); }
    #ch-ov-title.win { color: var(--neon-green); text-shadow: 0 0 14px rgba(57,255,20,.65); }
    #ch-ov-text { margin: 0; font-size: 13px; color: var(--text-dim); line-height: 1.9; }
    #ch-ov-text b { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 13px; }
    .ch-ov-line { margin-top: 8px; color: var(--text-main); font-family: var(--font-pixel); font-size: 12px; }
    .ch-ov-best { margin-top: 4px; font-size: 12px; color: var(--text-dim); }
    .ch-ov-best.new { color: var(--neon-yellow); text-shadow: 0 0 10px rgba(255,230,0,.6); }
    .ch-ov-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .ch-ov-btns .btn { font-size: 12px; padding: 9px 15px; }
    .ch-promo .ch-ov-card { width: min(330px, 88vw); }
    .ch-promo .ch-ov-card h2 { margin: 0 0 6px; font-family: var(--font-pixel); font-size: 14px; color: var(--neon-yellow); }
    .ch-promo .ch-ov-card p { margin: 0 0 10px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }
    .ch-promo-btns { display: flex; gap: 10px; justify-content: center; }
    .ch-promo-btn { width: 56px; height: 56px; border-radius: 12px; cursor: pointer;
      font-size: 30px; line-height: 1; color: #fffaf0;
      background: linear-gradient(160deg, #3a4d6e, #18202f); border: 1px solid rgba(0,240,255,.45);
      box-shadow: 0 0 14px rgba(0,240,255,.25), inset 0 1px 0 rgba(255,255,255,.15);
      transition: transform .14s ease, box-shadow .14s ease; }
    .ch-promo-btn:hover, .ch-promo-btn:active { transform: translateY(-2px) scale(1.05); box-shadow: 0 0 20px rgba(0,240,255,.5); }
  </style>
