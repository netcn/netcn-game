    .bp-wrap { padding: 10px 0 20px; width: min(440px, 100%); margin: 0 auto; text-align: center; }

      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));

      text-shadow: 0 0 8px rgba(0,240,255,0.35); padding: 4px 2px;
    }
    .bp-lv small { font-family: sans-serif; font-size: 8px; color: var(--text-dim); margin-top: 2px; }

      background: linear-gradient(90deg, rgba(255,45,149,0.08), rgba(0,240,255,0.05));
    }
    .bp-hud > span { display: inline-flex; align-items: center; gap: 4px; }
    .bp-hud b { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 10px; }

    .bp-chip {
      font-size: 9px; line-height: 1.4; padding: 3px 8px; border-radius: 999px;
      border: 1px solid rgba(24,32,52,0.2); background: rgba(24,32,52,0.05);
      color: var(--text-dim); white-space: nowrap;
    }
    .bp-chip b { font-family: var(--font-mono); font-size: 10px; }

      display: flex; align-items: center; gap: 7px; margin-top: 6px; padding: 4px 8px;

      display: block; width: 100%; height: auto; border-radius: 12px;
      border: 1px solid rgba(0,240,255,0.28); background: #070713; touch-action: none;

      border: 1px solid rgba(0,240,255,0.35);
      box-shadow: var(--ui-shadow);
    }
    .bp-card h2 {
      margin: 0 0 6px; font-family: var(--font-pixel); font-size: 13px;
      color: var(--neon-pink); text-shadow: 0 0 12px rgba(255,45,149,0.55);
    }
    .bp-card h2.win { color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255,230,0,0.6); }
    .bp-card p { margin: 0 0 9px; font-size: 11px; color: var(--text-dim); line-height: 1.7; }
    .bp-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 7px; margin: 8px 0;
      font-size: 10px; color: var(--text-dim);
    }
    .bp-stats span {
      display: flex; justify-content: space-between; gap: 5px;
      padding: 4px 7px; background: rgba(24,32,52,0.04); border-radius: 6px;
    }
    .bp-stats b { color: var(--neon-yellow); font-family: var(--font-mono); font-size: 10px; }
    .bp-record {
      margin: 6px 0 2px; font-size: 11px; color: var(--neon-yellow);
      text-shadow: 0 0 10px rgba(255,230,0,0.6); animation: bp-pop 0.5s ease;

    @keyframes bp-pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .bp-card .btn { display: block; width: 100%; margin-top: 7px; min-height: 44px; padding: 10px; }
    .bp-controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 9px 0 3px; }
    .bp-fire { min-width: 150px; min-height: 52px; padding: 13px 22px; font-size: 13px; border-radius: 12px; }
    .bp-pause-btn {
      min-width: 52px; min-height: 52px; padding: 0 15px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .bp-pause-ic {
      display: inline-block; width: 16px; height: 18px;
