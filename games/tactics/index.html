  <style>
    .tk-wrap { padding: 12px 10px 20px; width: min(640px, 98vw); text-align: center; margin: 0 auto; }
    .tk-top { display: flex; justify-content: center; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 12px; margin: 4px 2px 2px; color: var(--text-dim); }
    .tk-top .stat-value { font-family: var(--font-pixel); font-size: 11px; }
    .tk-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 4px 0 6px; line-height: 1.55; }
    .tk-msg.ai { color: var(--neon-yellow); }
    .tk-msg.ok { color: var(--neon-cyan); }

    /* ---------- 关卡选择 ---------- */
    .tk-pick { padding: 4px 0 2px; }
    .tk-pick-title { font-family: var(--font-pixel); font-size: 15px; color: var(--neon-cyan); text-shadow: 0 0 10px rgb(var(--nc-cyan-rgb) / .55); margin: 6px 0 6px; }
    .tk-pick-sub { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin: 0 auto 8px; max-width: 430px; }
    .tk-pick-best { display: inline-block; font-size: 11px; color: var(--neon-yellow); border: 1px dashed rgb(var(--nc-yellow-rgb) / .4); border-radius: 999px; padding: 4px 12px; margin-bottom: 12px; }
    .tk-levels { display: flex; flex-direction: column; gap: 10px; max-width: 440px; margin: 0 auto 14px; }
    .tk-lvl { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 74px; padding: 10px 14px; border: 2px solid rgb(var(--nc-cyan-rgb) / .4); border-radius: 10px; background: linear-gradient(135deg, rgb(var(--nc-cyan-rgb) / .10), rgb(var(--nc-pink-rgb) / .06)); color: var(--text-main); cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .12s; font-family: inherit; }
    .tk-lvl:active { transform: scale(.98); }
    .tk-lvl:hover { border-color: var(--neon-cyan); box-shadow: var(--ui-shadow); }
    .tk-lvl.locked { opacity: .45; cursor: not-allowed; border-color: rgba(24,32,52,.16); background: rgba(24,32,52,.04); }
    .tk-lvl-num { font-family: var(--font-pixel); font-size: 17px; color: var(--neon-cyan); min-width: 36px; text-align: center; }
    .tk-lvl-body { flex: 1; min-width: 0; }
    .tk-lvl-t { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-yellow); text-shadow: 0 0 6px rgb(var(--nc-yellow-rgb) / .4); margin-bottom: 4px; line-height: 1.5; }
    .tk-lvl-d { font-size: 11px; color: var(--text-dim); line-height: 1.55; }
    .tk-lvl-stars { display: flex; gap: 3px; margin-top: 6px; }
    .tk-lvl-state { font-size: 11px; color: var(--neon-green); white-space: nowrap; font-family: var(--font-pixel); }
    .tk-lvl.locked .tk-lvl-state { color: var(--text-dim); }
    .tk-diff { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 0 auto 4px; }
    .tk-diff .mode-btn { min-height: 44px; min-width: 72px; }
    .tk-diff-note { font-size: 11px; color: var(--text-dim); line-height: 1.6; margin: 6px auto 10px; max-width: 430px; }

    /* ---------- 战场 ---------- */
    .tk-stage { position: relative; display: flex; flex-direction: column; align-items: center; }
    .tk-boardView {
      position: relative; width: 100%; max-width: 100%; max-height: 58vh;
      margin: 0 auto; overflow: auto; border-radius: 12px;
      overscroll-behavior: contain; touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch; scrollbar-width: thin;
    }
    .tk-boardView::-webkit-scrollbar { width: 6px; height: 6px; }
    .tk-boardView::-webkit-scrollbar-thumb { background: rgb(var(--nc-cyan-rgb) / .32); border-radius: 3px; }
    .tk-boardView.zoomed { cursor: grab; }
    .tk-boardView.dragging { cursor: grabbing; }
    .tk-boardWrap { position: relative; width: fit-content; margin: 0 auto; }
    .tk-board {
      display: grid; gap: 2px; padding: 6px; margin: 0 auto; width: fit-content;
      background: linear-gradient(160deg, #1d3b27 0%, #102019 55%, #152b1e 100%);
      border: 1px solid rgb(var(--nc-cyan-rgb) / .22); border-radius: 12px;
      box-shadow: 0 10px 32px rgba(0,0,0,.5), inset 0 0 26px rgba(0,0,0,.45);
      user-select: none; touch-action: manipulation;
    }
    .tk-fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }
    .tk-cell {
      width: var(--tk-cell, 40px); height: var(--tk-cell, 40px); border-radius: 5px; position: relative;
      cursor: pointer; transition: background .12s ease, box-shadow .12s ease; overflow: hidden;
    }
    .tk-cell.grass { background: linear-gradient(160deg, #2c5a35, #1e3d28); box-shadow: inset 0 0 0 1px rgba(120,200,140,.08); }
    .tk-cell.alt { background: linear-gradient(160deg, #31633b, #214530); }
    .tk-cell.hill { background: linear-gradient(160deg, #55713c, #2c4527); box-shadow: inset 0 0 0 1px rgb(var(--nc-yellow-rgb) / .16); }
    .tk-cell.forest { background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2)); box-shadow: inset 0 0 0 1px rgb(var(--nc-green-rgb) / .18); }
    .tk-cell.wall { background: linear-gradient(160deg, #4a5470, #222a3d); box-shadow: inset 0 0 0 1px rgba(24,32,52,.14), inset 0 -6px 10px rgba(0,0,0,.4); cursor: default; }
    .tk-cell.wall::after { content: ''; position: absolute; inset: 3px; border-radius: 3px; background: linear-gradient(135deg, rgba(24,32,52,.14), transparent 52%); }
    .tk-cell.hill::before { content: ''; position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid rgb(var(--nc-yellow-rgb) / .28); }
    .tk-cell.forest::before { content: ''; position: absolute; inset: 14%; background:
      radial-gradient(circle at 30% 34%, rgb(var(--nc-green-rgb) / .30) 0 9%, transparent 10%),
      radial-gradient(circle at 66% 46%, rgb(var(--nc-green-rgb) / .24) 0 11%, transparent 12%),
      radial-gradient(circle at 44% 74%, rgb(var(--nc-cyan-rgb) / .10) 0 8%, transparent 9%); }
    .tk-cell.canmove { background: rgb(var(--nc-cyan-rgb) / .22); box-shadow: var(--ui-shadow); }
    .tk-cell.canatk { background: rgb(var(--nc-pink-rgb) / .16); box-shadow: inset 0 0 0 2px rgb(var(--nc-pink-rgb) / .55), 0 0 12px rgb(var(--nc-pink-rgb) / .35); }
    .tk-cell.canmove.canatk { background: linear-gradient(135deg, rgb(var(--nc-cyan-rgb) / .22), rgb(var(--nc-pink-rgb) / .20)); box-shadow: inset 0 0 0 2px rgb(var(--nc-purple-rgb) / .6), 0 0 12px rgb(var(--nc-purple-rgb) / .4); }
    .tk-cell.sel { box-shadow: inset 0 0 0 3px var(--neon-yellow), 0 0 18px rgb(var(--nc-yellow-rgb) / .55); z-index: 2; }
    .tk-cell.target { box-shadow: inset 0 0 0 2px rgb(var(--nc-pink-rgb) / .85), 0 0 14px rgb(var(--nc-pink-rgb) / .6); animation: tkTarget 1s ease-in-out infinite; }
    .tk-cell.cursor { outline: 2px dashed rgba(24,32,52,.65); outline-offset: -4px; }
    @keyframes tkTarget { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

    .tk-detail { display: flex; gap: 6px 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0 2px; font-size: 11px; color: var(--text-dim); min-height: 20px; }
    .tk-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(24,32,52,.14); border-radius: 999px; padding: 3px 9px; line-height: 1.3; }
    .tk-chip b { color: var(--neon-cyan); font-family: var(--font-pixel); font-size: 10px; }
    .tk-chip.hp b { color: var(--neon-green); }
    .tk-chip.atk b { color: var(--neon-yellow); }
    .tk-chip.rng b { color: var(--neon-purple); }
    .tk-chip.mov b { color: #6fa8ff; }
    .tk-chip.warn { border-color: rgb(var(--nc-pink-rgb) / .45); color: var(--neon-pink); }
    .tk-chip.good { border-color: rgb(var(--nc-green-rgb) / .35); color: var(--neon-green); }
    .tk-endturn { margin: 4px auto 8px; min-width: 150px; }
    .tk-zoom-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px auto 2px; }
    .tk-zoom-bar .btn { min-width: 44px; min-height: 44px; padding: 0 10px; font-size: 12px; }
    .tk-zoom-bar .tk-zoom-toggle { min-width: 92px; font-size: 10px; }
    .tk-zoom-hint { font-size: 10px; color: var(--text-dim); margin: 2px 0 6px; line-height: 1.5; }
    .tk-legend { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 10px; color: var(--text-dim); margin-top: 6px; }
    .tk-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .tk-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }

    /* ---------- 结算/浮层 ---------- */
    .tk-overlay {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: var(--nc-stage-2); padding: 16px;
    }
    .tk-overlay.hidden { display: none; }
    .tk-modal {
      background: var(--bg-panel); border: 1px solid var(--accent, #00f0ff); border-radius: 12px;
      padding: 20px; width: min(420px, 94vw); text-align: center;
      box-shadow: 0 0 30px color-mix(in srgb, var(--accent, #00f0ff) 25%, transparent);
    }
    .tk-modal h2 { font-family: var(--font-pixel); font-size: 15px; margin-bottom: 10px; line-height: 1.5; }
    .tk-modal h2.win { color: var(--neon-green); text-shadow: 0 0 10px rgb(var(--nc-green-rgb) / .6); }
    .tk-modal h2.lose { color: var(--neon-pink); text-shadow: 0 0 10px rgb(var(--nc-pink-rgb) / .6); }
    .tk-modal p { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin-bottom: 12px; }
    .tk-result { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 14px; }
    .tk-result div { border: 1px solid rgba(24,32,52,.12); border-radius: 8px; padding: 7px 8px; font-size: 11px; color: var(--text-dim); }
    .tk-result b { display: block; font-family: var(--font-pixel); font-size: 14px; color: var(--neon-yellow); margin-top: 3px; }
    .tk-result .rec b { color: var(--neon-green); }
    .tk-modal .game-controls { gap: 8px; margin: 0; }
    #tk-battle .game-controls.is-hidden { display: none; }
    .tk-modal .btn { font-size: 10px; padding: 10px 14px; }

  </style>
