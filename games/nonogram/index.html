    .no-cell { position: relative; aspect-ratio: 1 / 1; padding: 0; border-radius: 5px; cursor: pointer;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14);
      transition: background .18s ease, box-shadow .22s ease, transform .14s ease;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .no-grid.big .no-cell { border-radius: 3px; }

    .no-cell:active { transform: scale(.94); background: rgba(0,240,255,.2); }

    @keyframes noRipple { 0% { transform: scale(.25); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    .no-cell.crossed::after { content: '×'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

    .no-ov-title { font-family: var(--font-pixel); font-size: clamp(15px, 4.5vw, 20px); color: var(--neon-yellow); text-shadow: 0 0 14px rgba(255,230,0,.6); }
