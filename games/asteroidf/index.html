  <style>
    .as-wrap { padding: 10px 10px 16px; width: min(660px, 100%); margin: 0 auto; text-align: center; }
    .as-hud {
      padding: 7px 9px; margin-bottom: 7px; border-radius: 10px;
      background: linear-gradient(90deg, rgba(0,240,255,0.07), rgba(185,103,255,0.09));
      border: 1px solid rgba(0,240,255,0.28);
      display: flex; flex-direction: column; gap: 5px;
    }
    .as-hud-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .as-stat { font-size: 11px; color: var(--text-dim); white-space: nowrap; letter-spacing: .02em; }
    .as-stat b { color: var(--neon-yellow); font-family: Consolas, 'Courier New', monospace; font-size: 13px; margin-left: 3px; }
    .as-best-wrap b { color: var(--neon-purple); }
    .as-pause-mini {
      flex: 0 0 auto; width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0;
      display: flex; align-items: center; justify-content: center; border-radius: 9px; cursor: pointer;
      border: 1px solid rgba(0,240,255,0.32); background: rgba(0,240,255,0.06); touch-action: manipulation;
    }
    .as-pause-mini:active { transform: scale(0.94); background: rgba(0,240,255,0.16); }
    .as-pause-ico { position: relative; display: block; width: 13px; height: 15px; }
    .as-pause-ico::before, .as-pause-ico::after {
      content: ''; position: absolute; top: 0; width: 5px; height: 100%; border-radius: 1px;
      background: var(--neon-cyan); box-shadow: var(--ui-shadow);
    }
    .as-pause-ico::before { left: 0; }
    .as-pause-ico::after { right: 0; }
    .as-meters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 10px; color: var(--text-dim); }
    .as-meter { display: inline-flex; align-items: center; gap: 4px; letter-spacing: .04em; }
    .as-meter em { font-style: normal; }
    .as-meter b { font-family: Consolas, 'Courier New', monospace; font-size: 11px; color: var(--neon-cyan); min-width: 26px; text-align: left; }
    .as-meter.spread b { color: var(--neon-purple); }
    .as-meter.rapid b { color: var(--neon-orange); }
    .as-shield-bar { width: 70px; height: 7px; border-radius: 4px; overflow: hidden; background: rgba(24,32,52,0.07); border: 1px solid rgba(0,240,255,0.28); }
    .as-shield-fill { display: block; height: 100%; width: 0%; background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2)); box-shadow: var(--ui-shadow); transition: width .12s linear; }
    .as-dot-shield { width: 9px; height: 11px; border: 1px solid var(--neon-cyan); border-radius: 50% 50% 42% 42% / 26% 26% 74% 74%; box-shadow: var(--ui-shadow); }
    .as-stage {
      position: relative; width: 100%; max-width: 640px; margin: 0 auto; border-radius: 12px;
      overflow: hidden; filter: drop-shadow(0 0 16px rgba(0,240,255,0.10));
    }
    .as-canvas {
      display: block; width: 100%; height: auto; border-radius: 12px; background: var(--nc-stage-2);
      border: 1px solid rgba(0,240,255,0.30); box-shadow: var(--ui-shadow);
      touch-action: none; max-width: 100%;
    }
    .as-wave-banner {
      position: absolute; left: 50%; top: 15%; transform: translate(-50%, 10px) scale(0.86);
      z-index: 4; pointer-events: none; opacity: 0; white-space: nowrap; text-align: center;
      font-family: var(--font-pixel); font-size: 12px; color: var(--neon-yellow);
      text-shadow: none;
      padding: 8px 14px; border-radius: 12px; background: var(--nc-stage-2);
      border: 1px solid currentColor; box-shadow: 0 0 22px currentColor;
      transition: opacity .28s ease, transform .28s cubic-bezier(.2,1.5,.4,1);
    }
    .as-wave-banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .as-wave-banner small { display: block; margin-top: 4px; font-family: Consolas, monospace; font-size: 9px; color: var(--neon-cyan); letter-spacing: .1em; }
    .as-overlay {
      position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
      background: var(--nc-stage-2); border-radius: 12px;
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }
    .as-card {
      width: min(330px, 92%); max-height: 94%; overflow: auto; padding: 15px 14px; text-align: center;
      border-radius: 14px; border: 1px solid rgba(0,240,255,0.35);
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      box-shadow: var(--ui-shadow);
    }
    .as-card h2 {
      margin: 0 0 8px; font-family: var(--font-pixel); font-size: 14px; line-height: 1.5;
      color: var(--neon-pink); text-shadow: 0 0 12px rgba(255,45,149,0.55);
    }
    .as-card h2.win { color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255,230,0,0.6); }
    .as-card p { margin: 0 0 10px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }
    .as-card .btn { display: block; width: 100%; margin-top: 8px; }
    .as-diffs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 6px; }
    .as-diffs .mode-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; width: auto; flex: 1 1 0; min-width: 0; padding: 9px 6px; }
    .as-diffs small { font-size: 10px; color: var(--text-dim); }
    .as-ctl-help { margin-top: 9px; padding: 7px 9px; text-align: left; font-size: 11px; line-height: 1.55; color: var(--text-dim); background: rgba(0,240,255,0.05); border: 1px solid rgba(0,240,255,0.16); border-radius: 8px; }
    .as-ctl-help b { display: block; margin-bottom: 2px; font-family: var(--font-pixel); font-size: 9px; letter-spacing: .06em; color: var(--neon-cyan); }
    .as-ctl-help div + div { margin-top: 6px; }
    .as-pick-hint { margin-top: 8px; font-size: 10px; letter-spacing: .1em; color: var(--neon-cyan); opacity: .8; }
    .as-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 8px; margin: 8px 0; font-size: 11px; color: var(--text-dim); }
    .as-stats b { display: block; margin-top: 2px; color: var(--neon-yellow); font-family: Consolas, monospace; font-size: 14px; }
    .as-new { margin: 2px 0 8px; font-family: var(--font-pixel); font-size: 11px; color: var(--neon-yellow); text-shadow: 0 0 10px rgba(255,230,0,0.7); animation: asPulse 1.1s ease-in-out infinite; }
    .as-btns { display: flex; gap: 8px; margin-top: 8px; }
    .as-card .as-btns .btn { flex: 1; width: auto; margin-top: 0; padding-left: 6px; padding-right: 6px; }
    @keyframes asPulse { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
    .as-deck { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 8px; touch-action: none; -webkit-user-select: none; user-select: none; }
    .as-stick {
      position: relative; width: 132px; height: 132px; min-width: 120px; min-height: 120px; border-radius: 50%;
      touch-action: none; background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      border: 2px solid rgba(0,240,255,0.30); box-shadow: var(--ui-shadow);
    }
    .as-stick::before { content: ''; position: absolute; inset: 20px; border-radius: 50%; border: 1px dashed rgba(0,240,255,0.22); }
    .as-stick::after { content: ''; position: absolute; left: 50%; top: 50%; width: 86px; height: 86px; margin: -43px 0 0 -43px; border-radius: 50%; border: 1px solid rgba(185,103,255,0.14); }
    .as-stick.active { border-color: rgba(0,240,255,0.72); box-shadow: var(--ui-shadow); }
    .as-stick-knob {
      position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
      touch-action: none; pointer-events: none; will-change: transform;
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      border: 1px solid rgba(170,252,255,0.9); box-shadow: var(--ui-shadow);
    }
    .as-stick-knob::after { content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--nc-stage-2); box-shadow: 0 0 8px #fff; }
    .as-acts { display: grid; grid-template-columns: 76px 60px; grid-template-rows: 70px 70px; gap: 8px; touch-action: none; }
    .as-act {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      min-width: 56px; min-height: 56px; padding: 0; border-radius: 12px; touch-action: none; cursor: pointer;
      font-family: var(--font-pixel); font-size: 9px; letter-spacing: .08em;
      color: var(--neon-yellow); border: 2px solid var(--neon-yellow);
      background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2));
      box-shadow: 0 0 10px rgba(255,230,0,0.26), inset 0 0 12px rgba(255,230,0,0.10);
      transition: transform .08s ease, box-shadow .1s ease, background .1s ease;
      -webkit-user-select: none; user-select: none;
    }
    .as-act.fire { grid-row: 1 / span 2; }
    .as-act.shield { grid-column: 2; grid-row: 1; color: var(--neon-cyan); border-color: var(--neon-cyan); background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2)); box-shadow: var(--ui-shadow); }
    .as-act.dash { grid-column: 2; grid-row: 2; color: var(--neon-purple); border-color: var(--neon-purple); background: linear-gradient(160deg,var(--nc-stage),var(--nc-stage-2)); box-shadow: 0 0 10px rgba(185,103,255,0.26), inset 0 0 12px rgba(185,103,255,0.10); }
    .as-act.pressed { transform: scale(0.93); box-shadow: 0 0 24px currentColor, inset 0 0 20px rgba(24,32,52,0.18); }
    .as-act span { pointer-events: none; line-height: 1; }
    .as-ico-fire { position: relative; width: 9px; height: 24px; border-radius: 5px; background: linear-gradient(180deg, #ffffff, #ffe600 45%, #ff8a00); box-shadow: 0 0 12px rgba(255,230,0,0.9); }
    .as-ico-fire::before, .as-ico-fire::after { content: ''; position: absolute; left: -9px; width: 6px; height: 16px; border-radius: 3px; background: linear-gradient(180deg, rgba(255,230,0,0.85), rgba(255,120,0,0.25)); }
    .as-ico-fire::before { top: 1px; transform: rotate(-24deg); }
    .as-ico-fire::after { top: 7px; transform: rotate(24deg); }
    .as-ico-shield { width: 20px; height: 24px; border: 2px solid var(--neon-cyan); border-radius: 50% 50% 42% 42% / 26% 26% 74% 74%; box-shadow: var(--ui-shadow); }
    .as-ico-dash { position: relative; width: 26px; height: 20px; }
    .as-ico-dash::before, .as-ico-dash::after { content: ''; position: absolute; top: 50%; left: 2px; width: 12px; height: 12px; margin-top: -6px; border-top: 2px solid var(--neon-purple); border-right: 2px solid var(--neon-purple); transform: rotate(45deg); box-shadow: 3px -3px 8px rgba(185,103,255,0.5); }
    .as-ico-dash::after { left: 11px; opacity: .55; }
    .as-msg { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .as-help {
      margin-top: 12px; padding: 10px 12px; font-size: 12px; line-height: 1.8; text-align: left;
      color: var(--text-dim); background: rgba(24,32,52,0.04); border-radius: 8px;
    }
    @media (max-width: 420px) {
      .as-wrap { padding: 6px 6px 12px; }
      .as-hud { padding: 6px 7px; gap: 4px; }
      .as-stat { font-size: 10px; }
      .as-stat b { font-size: 12px; }
      .as-meters { gap: 7px; font-size: 9px; }
      .as-shield-bar { width: 54px; }
      .as-stick { width: 124px; height: 124px; }
      .as-stick-knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
      .as-acts { grid-template-columns: 70px 60px; grid-template-rows: 66px 66px; gap: 6px; }
      .as-card { padding: 11px 10px; }
      .as-card h2 { font-size: 12px; }
      .as-card p { font-size: 11px; }
      .as-diffs small { display: none; }
      .as-diffs .mode-btn { padding: 8px 9px; }
      .as-help { display: none; }
    }
  </style>
