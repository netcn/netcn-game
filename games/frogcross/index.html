    .fr-wrap { padding: 14px; width: min(480px, 96vw); text-align: center; }

    .fr-dpad { min-height: 44px; }
    .fr-pads { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 10px auto 0; }

    .fr-pad-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .fr-pad-label { font-family: var(--font-pixel); font-size: 9px; color: var(--neon-cyan); letter-spacing: 1px; }
    .fr-dive { min-height: 44px; min-width: 96px; padding: 6px 14px; font-family: var(--font-pixel); font-size: 10px;
      color: var(--text-dim); background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.22);
      border-radius: 8px; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .fr-dive small { font-size: 9px; opacity: 0.75; }
    .fr-dive.ready { color: var(--neon-cyan); border-color: rgba(0,240,255,0.6); box-shadow: 0 0 10px rgba(0,240,255,0.25); }
    .fr-heart { display: inline-block; width: 9px; height: 9px; margin-right: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.14); vertical-align: -1px; }
    .fr-heart.on { background: #39ff14; box-shadow: 0 0 6px rgba(57,255,20,0.7); }
    .fr-p1 { color: #39ff14; margin-right: 4px; }
    .fr-p2 { color: #00f0ff; margin-right: 4px; }
    .fr-prog { color: var(--neon-yellow); font-size: 12px; }
    .fr-ov { position: absolute; inset: 0; z-index: 2; border-radius: 10px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 18px; text-align: center;
      background: rgba(4,10,8,0.9); backdrop-filter: blur(2px); }
    .fr-ov.hidden { display: none; }
    .fr-ov-title { font-family: var(--font-pixel); font-size: 16px; color: var(--neon-yellow); text-shadow: 0 0 10px rgba(255,230,0,.55); line-height: 1.5; }
    .fr-ov-body { font-size: 13px; color: var(--text-dim); line-height: 1.75; }
    .fr-ov-note { margin-top: 6px; font-size: 12px; color: var(--neon-cyan); }
    .fr-ov-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
