  <style>
    .hs-wrap { padding: 10px 8px 18px; width: min(680px, 100%); box-sizing: border-box; margin: 0 auto; text-align: center; }
    .hs-top { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 13px; margin: 6px 2px; color: var(--text-dim); }
    .hs-top .stat-value { font-family: var(--font-pixel); color: var(--neon-cyan); text-shadow: 0 0 6px rgba(0,240,255,.45); }
    .hs-msg { min-height: 20px; font-size: 13px; color: var(--neon-pink); margin: 6px 0; line-height: 1.6; text-shadow: 0 0 8px rgba(255,45,149,.25); }
    .hs-canvas {
      width: 100%; height: auto; border-radius: 12px; background: #05050b;
      border: 1px solid rgba(0,240,255,0.35); touch-action: manipulation; cursor: pointer; max-width: 100%;
      box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.55), 0 0 34px rgba(0,240,255,.14);
      outline: none; }
    .hs-canvas:focus-visible { outline: 2px solid var(--neon-yellow); outline-offset: 3px; }
    .hs-stage { position: relative; border-radius: 12px; }
    .hs-overlay {
      position: absolute; inset: 0; z-index: 3; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(120% 90% at 50% 30%, rgba(8,16,32,.82), rgba(4,5,12,.95));
      text-align: center; padding: 16px; backdrop-filter: blur(3px);
    }
    .hs-overlay.hidden { display: none; }
    .hs-ov-title { font-family: var(--font-pixel); font-size: 17px; color: var(--neon-green); text-shadow: 0 0 10px rgba(57,255,20,.6), 0 0 26px rgba(57,255,20,.3); }
    .hs-ov-sub { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
    .hs-ov-sub b { color: var(--neon-yellow); font-family: var(--font-pixel); font-size: 12px; }
    .hs-win-line { font-size: 12px; color: var(--text-dim); }
    .hs-win-line b { color: var(--neon-yellow); font-family: var(--font-pixel); }
    .hs-newrec { font-family: var(--font-pixel); font-size: 11px; color: var(--neon-yellow); margin-top: 4px; animation: hsGlow 1.1s ease-in-out infinite alternate; }
    .hs-overlay:not(.hidden) .hs-ov-title { animation: hsPop .55s cubic-bezier(.2,1.5,.4,1) both; }
    .hs-overlay:not(.hidden) .hs-ov-sub { animation: hsFade .45s ease-out .18s both; }
    .hs-overlay:not(.hidden) button { animation: hsFade .45s ease-out .3s both; }
    @keyframes hsPop {
      from { transform: scale(.7) translateY(10px); opacity: 0; letter-spacing: 0; }
      to { transform: none; opacity: 1; }
    }
    @keyframes hsFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes hsGlow { from { text-shadow: 0 0 6px rgba(255,230,0,.4); } to { text-shadow: 0 0 18px rgba(255,230,0,.95); } }

    /* ---------- 星级 ---------- */
    .hs-stars { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; }
    .hs-star { display: inline-block; width: 11px; height: 11px; font-style: normal;
      background: rgba(255,255,255,.16);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
    .hs-star.on { background: linear-gradient(160deg, #fff7a8, #ffe600 42%, #ff9f1c);
      filter: drop-shadow(0 0 4px rgba(255,230,0,.85)); }
    .hs-stars.lg { gap: 7px; margin: 2px 0 4px; }
    .hs-stars.lg .hs-star { width: 24px; height: 24px; }
    .hs-stars.lg .hs-star.on { animation: hsStarIn .55s cubic-bezier(.2,1.6,.4,1) both; }
    .hs-stars.lg .hs-star.on:nth-child(2) { animation-delay: .1s; }
    .hs-stars.lg .hs-star.on:nth-child(3) { animation-delay: .2s; }
    @keyframes hsStarIn { from { transform: scale(.2) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .hs-stars.xs { gap: 1px; }
    .hs-stars.xs .hs-star { width: 8px; height: 8px; }

    /* ---------- 面板 ---------- */
    .hs-pack { position: fixed; inset: 0; z-index: 58; display: flex; align-items: center; justify-content: center; background: rgba(4,6,12,.82); backdrop-filter: blur(5px); padding: 12px; }
    .hs-pack.hidden { display: none; }
    .hs-pack-card, .hs-meta-card { width: min(372px, 94vw); max-height: 88vh; box-sizing: border-box; padding: 14px 13px; background: linear-gradient(160deg, rgba(16,20,36,.995), rgba(8,10,20,.995)); border: 1px solid rgba(185,103,255,.5); border-radius: 16px; box-shadow: 0 0 36px rgba(185,103,255,.28), inset 0 0 30px rgba(0,240,255,.05); animation: hsPop .42s cubic-bezier(.2,1.4,.4,1) both; display: flex; flex-direction: column; overflow: hidden; }
    .hs-meta-card { width: min(430px, 94vw); border-color: rgba(0,240,255,.5); box-shadow: 0 0 36px rgba(0,240,255,.24), inset 0 0 30px rgba(185,103,255,.06); }
    .hs-pack-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-pixel); font-size: 13px; color: var(--neon-purple); margin-bottom: 8px; flex: none; }
    .hs-meta-card .hs-pack-head { color: var(--neon-cyan); }
    .hs-pack-close { min-width: 44px; min-height: 44px; border-radius: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: var(--text); font-size: 16px; cursor: pointer; line-height: 1; }
    .hs-pack-close:hover { background: rgba(255,255,255,.16); }
    .hs-pack-sum { font-size: 11px; color: var(--neon-yellow); margin: 0 0 10px; flex: none; }
    .hs-pack-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1 1 auto; padding: 2px; }
    .hs-pack-lv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 66px; padding: 5px 2px; border-radius: 10px; border: 1px solid rgba(0,240,255,.35); background: linear-gradient(170deg, rgba(0,240,255,.10), rgba(0,240,255,.03)); color: var(--text); cursor: pointer; transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease; animation: hsFade .34s ease both; }
    .hs-pack-lv:hover { transform: translateY(-2px); box-shadow: 0 0 16px rgba(0,240,255,.28); border-color: rgba(0,240,255,.7); }
    .hs-pack-lv b { font-family: var(--font-pixel); font-size: 13px; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,240,255,.4); }
    .hs-pack-lv span { font-size: 9px; color: var(--text-dim); white-space: nowrap; }
    .hs-pack-lv.active { border-color: var(--neon-green); background: rgba(57,255,20,.12); box-shadow: 0 0 14px rgba(57,255,20,.22); }
    .hs-pack-lv.locked { opacity: .45; cursor: not-allowed; border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.04); }
    .hs-pack-lv em { font-style: normal; font-size: 9px; color: var(--text-dim); }
    .hs-pack-tip { margin-top: 10px; font-size: 10.5px; line-height: 1.65; color: var(--text-dim); flex: none; }
    .hs-meta-sum { font-size: 11px; color: var(--neon-yellow); margin-bottom: 8px; flex: none; }
    .hs-meta-body { overflow-y: auto; min-height: 0; flex: 1 1 auto; padding-right: 2px; }
    .hs-sec-title { font-family: var(--font-pixel); font-size: 10px; letter-spacing: 1px; color: var(--neon-purple); margin: 12px 2px 7px; }
    .hs-ach-list { display: flex; flex-direction: column; gap: 6px; }
    .hs-ach { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); animation: hsFade .3s ease both; }
    .hs-ach.on { border-color: rgba(255,230,0,.42); background: linear-gradient(100deg, rgba(255,230,0,.10), rgba(255,230,0,.02)); box-shadow: 0 0 12px rgba(255,230,0,.1); }
    .hs-ach.off { opacity: .55; }
    .hs-ach-badge { flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: rgba(255,255,255,.16); font-family: var(--font-pixel); font-size: 8px; color: #071018; }
    .hs-ach.on .hs-ach-badge { background: linear-gradient(160deg, #fff7a8, #ffe600 45%, #ff9f1c); box-shadow: 0 0 12px rgba(255,230,0,.55); }
    .hs-ach-txt { flex: 1; min-width: 0; text-align: left; }
    .hs-ach-txt b { display: block; font-size: 12px; color: var(--text); font-weight: 600; }
    .hs-ach.on .hs-ach-txt b { color: var(--neon-yellow); }
    .hs-ach-txt span { display: block; font-size: 10px; color: var(--text-dim); line-height: 1.45; }
    .hs-ach em { flex: none; font-style: normal; font-size: 9px; color: var(--text-dim); }
    .hs-ach.on em { color: var(--neon-green); }
    .hs-meta-records { display: flex; flex-direction: column; gap: 8px; }
    .hs-rec-block { border: 1px solid rgba(0,240,255,.18); border-radius: 10px; padding: 6px 8px; background: rgba(0,240,255,.03); }
    .hs-rec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-pixel); font-size: 10px; color: var(--neon-cyan); margin-bottom: 4px; }
    .hs-rec-row { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--text-dim); line-height: 1.6; }
    .hs-rec-row:first-of-type { color: var(--neon-yellow); }
    .hs-meta-empty { font-size: 11px; color: var(--text-dim); padding: 4px 2px 8px; }
    .hs-kb { display: block; margin-top: 4px; color: rgba(0,240,255,.62); }
    .mode-row .mode-btn { min-height: 44px; padding-top: 0; padding-bottom: 0; }

    /* ---------- 成就 toast ---------- */
    .hs-ach-toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 12px) scale(.92); z-index: 90;
      display: flex; align-items: center; gap: 10px; max-width: min(320px, 88vw); box-sizing: border-box;
      padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255,230,0,.65);
      background: linear-gradient(150deg, rgba(28,24,10,.97), rgba(10,10,20,.97));
      box-shadow: 0 0 28px rgba(255,230,0,.35), 0 8px 26px rgba(0,0,0,.5);
      opacity: 0; animation: hsToastIn .5s cubic-bezier(.2,1.5,.4,1) forwards; pointer-events: none; }
    .hs-ach-toast.out { animation: hsToastOut .45s ease forwards; }
    .hs-ach-toast .hs-ach-badge { width: 30px; height: 30px; font-size: 9px; background: linear-gradient(160deg, #fff7a8, #ffe600 45%, #ff9f1c); box-shadow: 0 0 14px rgba(255,230,0,.7); }
    .hs-ach-toast .t1 { font-family: var(--font-pixel); font-size: 9px; color: var(--neon-yellow); letter-spacing: 1px; }
    .hs-ach-toast .t2 { font-size: 12px; color: #fff; margin-top: 2px; }
    @keyframes hsToastIn { to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    @keyframes hsToastOut { to { opacity: 0; transform: translate(-50%, 14px) scale(.96); } }

    @media (max-width: 480px) {
      .hs-top { font-size: 11px; gap: 4px 10px; }
      .hs-ov-title { font-size: 14px; }
      .hs-pack-card, .hs-meta-card { padding: 12px 10px; }
      .hs-pack-grid { gap: 5px; }
      .hs-pack-lv { min-height: 62px; }
      .hs-pack-lv span { font-size: 8px; }
    }
    @media (max-width: 340px) {
      .hs-pack-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hs-canvas, .hs-overlay, .hs-pack-card, .hs-meta-card, .hs-ach, .hs-pack-lv { animation-duration: .01ms !important; }
      .hs-star.on, .hs-newrec { animation: none !important; }
