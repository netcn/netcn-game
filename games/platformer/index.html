    .pf-wrap { padding: 14px; width: min(760px, 96vw); text-align: center; }

    .pf-msg { min-height: 18px; font-size: 13px; color: var(--neon-green); margin: 8px 0 4px; }

    .pf-tbtn { flex: 1 1 0; min-width: 44px; height: 58px; border-radius: 14px; border: 1px solid rgba(0,240,255,.4); background: linear-gradient(180deg, rgba(0,240,255,.16), rgba(0,240,255,.04));
